<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0d11" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<title>통수본 근무</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#0a0d11;
    --panel:#11161c;
    --panel2:#161c23;
    --line:#27303a;
    --text:#f4f6f8;
    --muted:#89939f;
    --sun:#ff5b67;
    --sat:#4da3ff;
    --duty:#ff9f43;
    --rest:#ff5e7e;
    --work:#55aaff;
    --off:#b9c1cb;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .app{max-width:720px;margin:0 auto;padding:22px 16px 28px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
  h1{font-size:30px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.04em}
  .team-wrap{position:relative;min-width:104px}
  select{width:100%;appearance:none;-webkit-appearance:none;background:var(--panel2);border:1px solid var(--line);border-radius:16px;color:var(--text);font-size:20px;font-weight:750;padding:13px 36px 13px 16px;outline:none}
  .team-wrap:after{content:"▾";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:15px}
  .monthbar{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px;margin-bottom:10px}
  .iconbtn{height:48px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:15px;font-size:32px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .monthcenter{text-align:center}
  .monthtitle{font-size:25px;font-weight:800;letter-spacing:-.03em;transition:opacity .13s ease}
  .todaybtn{border:0;background:transparent;color:var(--muted);font-size:14px;padding:6px 10px;margin-top:2px;cursor:pointer}
  .calendar{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--panel);touch-action:none}
  .weekdays,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
  .weekdays{border-bottom:1px solid var(--line);background:#0f141a}
  .weekday{text-align:center;padding:13px 0 12px;font-size:14px;font-weight:750;color:var(--muted)}
  .weekday.sun{color:var(--sun)} .weekday.sat{color:var(--sat)}
  .grid{will-change:transform,opacity}
  .grid.enter-next{animation:enterNext .18s ease-out}
  .grid.enter-prev{animation:enterPrev .18s ease-out}
  @keyframes enterNext{from{transform:translateY(26px);opacity:.25}to{transform:translateY(0);opacity:1}}
  @keyframes enterPrev{from{transform:translateY(-26px);opacity:.25}to{transform:translateY(0);opacity:1}}
  .day{min-height:94px;padding:8px 6px 7px;border-right:1px solid rgba(39,48,58,.72);border-bottom:1px solid rgba(39,48,58,.72);position:relative;background:var(--panel);display:flex;flex-direction:column;cursor:pointer;user-select:none}
  .day:nth-child(7n){border-right:0}
  .day:nth-last-child(-n+7){border-bottom:0}
  .day.other{opacity:.34;background:#0d1116}
  .day.today{background:#192029;box-shadow:inset 0 0 0 2px rgba(244,246,248,.9)}
  .daynumrow{min-height:27px;display:flex;align-items:center}
  .daynum{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:27px;font-size:15px;font-weight:750;line-height:1;color:#e8ebef}
  .day.sun .daynum{color:var(--sun)}
  .day.sat .daynum{color:var(--sat)}
  .day.holiday:not(.sat) .daynum{color:var(--sun)}
  .shift{display:flex;justify-content:center;align-items:center;min-height:32px;margin-top:4px}
  .badge{min-width:38px;height:31px;padding:0 9px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:850;font-size:17px;border:1px solid transparent}
  .badge.duty{color:var(--duty);background:rgba(255,159,67,.12);border-color:rgba(255,159,67,.28)}
  .badge.rest{color:var(--rest);background:rgba(255,94,126,.11);border-color:rgba(255,94,126,.25)}
  .badge.work{color:var(--work);background:rgba(85,170,255,.11);border-color:rgba(85,170,255,.24)}
  .badge.off{color:var(--off);background:rgba(185,193,203,.08);border-color:rgba(185,193,203,.17)}
  .holiday-name{margin-top:auto;min-height:15px;padding-top:3px;text-align:center;color:var(--sun);font-size:9.5px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .legend{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:15px 8px 2px;color:var(--muted);font-size:13px}
  .legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%}.d1{background:var(--duty)}.d2{background:var(--rest)}.d3{background:var(--work)}.d4{background:var(--off)}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,18px);max-width:calc(100vw - 32px);padding:11px 15px;border-radius:13px;background:rgba(30,36,44,.96);border:1px solid rgba(255,255,255,.13);box-shadow:0 8px 30px rgba(0,0,0,.34);color:#fff;font-size:14px;font-weight:700;letter-spacing:-.02em;opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease;z-index:1000;text-align:center;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (max-width:430px){
    .app{padding:18px 10px 24px} h1{font-size:27px}.team-wrap{min-width:96px}select{font-size:18px;padding:12px 34px 12px 14px}
    .monthtitle{font-size:22px}.day{min-height:84px;padding:6px 4px}.daynumrow{min-height:24px}.daynum{min-width:26px;height:24px;font-size:14px}.shift{min-height:29px;margin-top:3px}.badge{min-width:34px;height:28px;font-size:16px;padding:0 7px}.holiday-name{font-size:8.5px;min-height:13px;padding-top:2px}.calendar{border-radius:18px}.toast{font-size:13px}
  }
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <h1>통수본 근무</h1>
    <div class="team-wrap">
      <select id="teamSelect" aria-label="팀 선택">
        <option value="1">1팀</option><option value="2">2팀</option><option value="3">3팀</option><option value="4">4팀</option>
        <option value="5">5팀</option><option value="6">6팀</option><option value="7">7팀</option><option value="8">8팀</option>
        <option value="9">9팀</option><option value="10">10팀</option><option value="11">11팀</option><option value="12">12팀</option>
      </select>
    </div>
  </div>

  <div class="monthbar">
    <button class="iconbtn" id="prevMonth" aria-label="이전 달">‹</button>
    <div class="monthcenter">
      <div class="monthtitle" id="monthTitle"></div>
      <button class="todaybtn" id="todayBtn">오늘</button>
    </div>
    <button class="iconbtn" id="nextMonth" aria-label="다음 달">›</button>
  </div>

  <section class="calendar" id="calendar" aria-label="근무 달력">
    <div class="weekdays">
      <div class="weekday sun">일</div><div class="weekday">월</div><div class="weekday">화</div><div class="weekday">수</div><div class="weekday">목</div><div class="weekday">금</div><div class="weekday sat">토</div>
    </div>
    <div class="grid" id="calendarGrid"></div>
  </section>

  <div class="legend" aria-label="근무 표시">
    <span><i class="dot d1"></i>당</span><span><i class="dot d2"></i>휴</span><span><i class="dot d3"></i>일</span><span><i class="dot d4"></i>비</span>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';

  const teamSelect = document.getElementById('teamSelect');
  const calendar = document.getElementById('calendar');
  const grid = document.getElementById('calendarGrid');
  const monthTitle = document.getElementById('monthTitle');
  const prevMonth = document.getElementById('prevMonth');
  const nextMonth = document.getElementById('nextMonth');
  const todayBtn = document.getElementById('todayBtn');
  const toast = document.getElementById('toast');

  const now = new Date();
  let viewYear = now.getFullYear();
  let viewMonth = now.getMonth();

  const savedTeam = Number(localStorage.getItem('tongsu_team'));
  let selectedTeam = (savedTeam >= 1 && savedTeam <= 12) ? savedTeam : 11;
  teamSelect.value = String(selectedTeam);

  // 근무 계산 엔진 R2 — 기존 검증본 유지.
  const TEAM_RULES = {
    1:{dutyAnchor:'2026-09-22'}, 2:{dutyAnchor:'2026-09-23'}, 3:{dutyAnchor:'2026-09-24'},
    4:{dutyAnchor:'2026-09-25'}, 5:{dutyAnchor:'2026-09-26'}, 6:{dutyAnchor:'2026-09-21'},
    7:{dutyAnchor:'2026-09-22'}, 8:{dutyAnchor:'2026-09-23'}, 9:{dutyAnchor:'2026-09-24'},
    10:{dutyAnchor:'2026-09-25'}, 11:{dutyAnchor:'2026-09-26'}, 12:{dutyAnchor:'2026-09-21'}
  };

  const OFFICIAL_HISTORY = {
    1:{'2026-09-20':'비','2026-09-21':'일','2026-09-22':'당','2026-09-23':'휴','2026-09-24':'비','2026-09-25':'비'},
    2:{'2026-09-20':'비','2026-09-21':'일','2026-09-22':'일','2026-09-23':'당','2026-09-24':'휴','2026-09-25':'비'},
    3:{'2026-09-20':'비','2026-09-21':'일','2026-09-22':'일','2026-09-23':'일','2026-09-24':'당','2026-09-25':'휴'},
    4:{'2026-09-20':'휴','2026-09-21':'일','2026-09-22':'일','2026-09-23':'일','2026-09-24':'비','2026-09-25':'당'},
    5:{'2026-09-20':'당','2026-09-21':'휴','2026-09-22':'일','2026-09-23':'일','2026-09-24':'비','2026-09-25':'비'},
    6:{'2026-09-20':'비','2026-09-21':'당','2026-09-22':'휴','2026-09-23':'일','2026-09-24':'비','2026-09-25':'비'},
    7:{'2026-09-20':'비','2026-09-21':'일','2026-09-22':'당','2026-09-23':'휴','2026-09-24':'비','2026-09-25':'비'},
    8:{'2026-09-20':'비','2026-09-21':'일','2026-09-22':'일','2026-09-23':'당','2026-09-24':'휴','2026-09-25':'비'},
    9:{'2026-09-20':'휴','2026-09-21':'일','2026-09-22':'일','2026-09-23':'일','2026-09-24':'당','2026-09-25':'휴'},
    10:{'2026-09-20':'당','2026-09-21':'휴','2026-09-22':'일','2026-09-23':'일','2026-09-24':'비','2026-09-25':'당'},
    11:{'2026-09-20':'비','2026-09-21':'일','2026-09-22':'일','2026-09-23':'일','2026-09-24':'비','2026-09-25':'비'},
    12:{'2026-09-20':'비','2026-09-21':'당','2026-09-22':'휴','2026-09-23':'일','2026-09-24':'비','2026-09-25':'비'}
  };

  // 2026년 관공서 공휴일/명절 표시 레이어.
  // 근무 기본값이 '일'인 경우 공휴일이면 '비'로 표시한다. 당/휴는 유지한다.
  const HOLIDAYS = {
    '2026-01-01':{label:'신정',name:'1월 1일'},
    '2026-02-16':{label:'설연휴',name:'설날 연휴'},
    '2026-02-17':{label:'설날',name:'설날'},
    '2026-02-18':{label:'설연휴',name:'설날 연휴'},
    '2026-03-01':{label:'3·1절',name:'3·1절'},
    '2026-03-02':{label:'대체휴일',name:'3·1절 대체공휴일'},
    '2026-05-01':{label:'노동절',name:'노동절'},
    '2026-05-05':{label:'어린이날',name:'어린이날'},
    '2026-05-24':{label:'부처님오신날',name:'부처님오신날'},
    '2026-05-25':{label:'대체휴일',name:'부처님오신날 대체공휴일'},
    '2026-06-03':{label:'선거일',name:'전국동시지방선거일'},
    '2026-06-06':{label:'현충일',name:'현충일'},
    '2026-07-17':{label:'제헌절',name:'제헌절'},
    '2026-08-15':{label:'광복절',name:'광복절'},
    '2026-08-17':{label:'대체휴일',name:'광복절 대체공휴일'},
    '2026-09-24':{label:'연휴',name:'추석 연휴'},
    '2026-09-25':{label:'추석',name:'추석'},
    '2026-09-26':{label:'연휴',name:'추석 연휴'},
    '2026-10-03':{label:'개천절',name:'개천절'},
    '2026-10-05':{label:'대체휴일',name:'개천절 대체공휴일'},
    '2026-10-09':{label:'한글날',name:'한글날'},
    '2026-12-25':{label:'성탄절',name:'기독탄신일'}
  };

  const DAY_MS = 86400000;
  const historyStart = '2026-09-20';
  const formulaStart = '2026-09-26';

  function pad(n){ return String(n).padStart(2,'0'); }
  function keyOf(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
  function utcDayFromKey(key){
    const [y,m,d] = key.split('-').map(Number);
    return Math.floor(Date.UTC(y,m-1,d) / DAY_MS);
  }
  function mod(n,m){ return ((n % m) + m) % m; }
  function holidayForKey(key){ return HOLIDAYS[key] || null; }

  function shiftForDate(team, y, m, d){
    const key = keyOf(y,m,d);
    if (key < historyStart) return '';

    if (key < formulaStart) return OFFICIAL_HISTORY[team]?.[key] ?? '';

    const rule = TEAM_RULES[team];
    if (!rule) return '';

    const delta = utcDayFromKey(key) - utcDayFromKey(rule.dutyAnchor);
    const phase = mod(delta, 6);
    if (phase === 0) return '당';
    if (phase === 1) return '휴';

    const weekday = new Date(y,m,d).getDay();
    if (weekday === 0 || weekday === 6 || holidayForKey(key)) return '비';
    return '일';
  }

  function badgeClass(shift){
    return shift === '당' ? 'duty' : shift === '휴' ? 'rest' : shift === '일' ? 'work' : 'off';
  }

  function dutyTeamsForDate(y,m,d){
    const teams = [];
    for(let team=1; team<=12; team++){
      if(shiftForDate(team,y,m,d) === '당') teams.push(team);
    }
    return teams;
  }

  function isToday(y,m,d){
    return y === now.getFullYear() && m === now.getMonth() && d === now.getDate();
  }

  let toastTimer = null;
  function showToastForDate(y,m,d){
    const key = keyOf(y,m,d);
    const holiday = holidayForKey(key);
    const dutyTeams = dutyTeamsForDate(y,m,d);
    const parts = [`${m+1}월 ${d}일`];
    if (holiday) parts.push(holiday.name);
    if (dutyTeams.length) parts.push(`당직 ${dutyTeams.map(t=>`${t}팀`).join(' · ')}`);
    else parts.push('당직 정보 없음');
    toast.textContent = parts.join(' · ');
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('show'), 1900);
  }

  function render(enterDirection=0){
    monthTitle.textContent = `${viewYear}년 ${viewMonth + 1}월`;
    grid.innerHTML = '';
    grid.classList.remove('enter-next','enter-prev');

    const first = new Date(viewYear, viewMonth, 1);
    const startOffset = first.getDay();
    const start = new Date(viewYear, viewMonth, 1 - startOffset);

    for(let i=0;i<42;i++){
      const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const y = date.getFullYear(), m = date.getMonth(), d = date.getDate();
      const wd = date.getDay();
      const key = keyOf(y,m,d);
      const shift = shiftForDate(selectedTeam,y,m,d);
      const holiday = holidayForKey(key);

      const cell = document.createElement('div');
      cell.className = 'day';
      if (m !== viewMonth) cell.classList.add('other');
      if (wd === 0) cell.classList.add('sun');
      if (wd === 6) cell.classList.add('sat');
      if (holiday) cell.classList.add('holiday');
      if (isToday(y,m,d)) cell.classList.add('today');

      const numRow = document.createElement('div');
      numRow.className = 'daynumrow';
      const n = document.createElement('div');
      n.className = 'daynum';
      n.textContent = d;
      numRow.appendChild(n);
      cell.appendChild(numRow);

      if (shift){
        const wrap = document.createElement('div');
        wrap.className = 'shift';
        const badge = document.createElement('span');
        badge.className = `badge ${badgeClass(shift)}`;
        badge.textContent = shift;
        wrap.appendChild(badge);
        cell.appendChild(wrap);
      }

      if (holiday){
        const h = document.createElement('div');
        h.className = 'holiday-name';
        h.textContent = holiday.label;
        cell.appendChild(h);
      }

      cell.addEventListener('click',()=>{
        if (Date.now() < suppressTapUntil) return;
        showToastForDate(y,m,d);
      });
      grid.appendChild(cell);
    }

    if (enterDirection !== 0){
      void grid.offsetWidth;
      grid.classList.add(enterDirection > 0 ? 'enter-next' : 'enter-prev');
    }
  }

  function changeMonth(delta){
    viewMonth += delta;
    if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    render(delta);
  }

  let touchStartX = 0;
  let touchStartY = 0;
  let touchStartAt = 0;
  let suppressTapUntil = 0;

  calendar.addEventListener('touchstart',e=>{
    if(e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartAt = Date.now();
  },{passive:true});

  calendar.addEventListener('touchend',e=>{
    if(!e.changedTouches.length) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const elapsed = Date.now() - touchStartAt;
    if(elapsed > 900) return;
    if(Math.abs(dy) < 55) return;
    if(Math.abs(dy) < Math.abs(dx) * 1.25) return;
    suppressTapUntil = Date.now() + 350;
    changeMonth(dy < 0 ? 1 : -1);
  },{passive:true});

  teamSelect.addEventListener('change',()=>{
    selectedTeam = Number(teamSelect.value);
    localStorage.setItem('tongsu_team',String(selectedTeam));
    render();
  });
  prevMonth.addEventListener('click',()=>changeMonth(-1));
  nextMonth.addEventListener('click',()=>changeMonth(1));
  todayBtn.addEventListener('click',()=>{
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();
    render();
  });

  render();
})();
</script>
<script>if('serviceWorker' in navigator && location.protocol.startsWith('http')){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>
<noscript><div style="padding:24px;color:#fff;background:#0a0d11;font-family:-apple-system,sans-serif">이 파일은 Safari에서 열어야 달력 조작이 가능합니다.</div></noscript>
</body>
</html>
