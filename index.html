<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0d11" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<title>통수본</title>
<meta name="tongsu-build" content="20261001-personal-single-v3" />
<style>
  :root{
    color-scheme:dark;
    --bg:#0a0d11;
    --panel:#11161c;
    --panel2:#161c23;
    --line:#27303a;
    --text:#f4f6f8;
    --muted:#89939f;
    --sun:#ff5b67;
    --sat:#4da3ff;
    --duty:#ff9f43;
    --rest:#ff5e7e;
    --work:#55aaff;
    --off:#d56a72;
    --personal:#d9e2ec;
    --personal-muted:#8d9aa8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  }
  body{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
  }
  .app{
    width:100%;
    max-width:720px;
    height:100dvh;
    margin:0 auto;
    padding:calc(16px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  h1{font-size:23px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.04em}
  .team-wrap{position:relative;min-width:82px}
  select{width:100%;appearance:none;-webkit-appearance:none;background:var(--panel2);border:1px solid var(--line);border-radius:14px;color:var(--text);font-size:16px;font-weight:750;padding:9px 30px 9px 12px;outline:none}
  .team-wrap:after{content:"▼";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:18px;font-weight:700;line-height:1}

  .monthbar{flex:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:8px;min-height:40px;margin-bottom:6px}
  .monthspacer{min-width:0}
  .monthcenter{text-align:center;min-width:0}
  .monthtitle{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.15;white-space:nowrap}
  .todaybtn{
    justify-self:end;
    margin-top:0;
    min-height:28px;
    padding:4px 10px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--panel2);
    color:#d7dde4;
    font-size:12.5px;
    font-weight:750;
    cursor:pointer;
    opacity:1;
    transition:opacity .14s ease,background .14s ease;
  }
  .todaybtn.is-hidden{visibility:hidden;opacity:0;pointer-events:none}

  .calendar{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    background:var(--panel);
    touch-action:none;
    overscroll-behavior:contain;
  }
  .weekdays{flex:0 0 auto;display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--line);background:#0f141a}
  .weekday{text-align:center;padding:11px 0 10px;font-size:14px;font-weight:750;color:var(--muted)}
  .weekday.sun{color:var(--sun)} .weekday.sat{color:var(--sat)}

  .month-viewport{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none}
  .month-track{position:absolute;inset:0 auto auto 0;width:100%;height:300%;will-change:transform;transform:translate3d(0,0,0)}
  .month-page{height:33.333333%;width:100%;overflow:hidden}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,minmax(0,1fr));height:100%;width:100%}

  /* [재설립] 기존 날짜/근무/공휴일 3단 구조 아래에 개인일정 전용 4번째 행을 독립 배치 */
  .day{min-height:0;padding:2px 3px 2px;border-right:1px solid rgba(39,48,58,.72);border-bottom:1px solid rgba(39,48,58,.72);position:relative;background:var(--panel);display:grid;grid-template-rows:22px 26px 12px minmax(0,1fr);align-content:start;cursor:pointer;user-select:none;overflow:hidden}
  .day:nth-child(7n){border-right:0}
  .day:nth-last-child(-n+7){border-bottom:0}
  .day.other{opacity:.34;background:#0d1116}
  .day.today{background:#192029;box-shadow:inset 0 0 0 2px rgba(244,246,248,.9)}
  .daynumrow{min-height:22px;display:flex;align-items:center}
  .daynum{display:inline-flex;align-items:center;justify-content:flex-start;min-width:25px;height:22px;font-size:13.5px;font-weight:750;line-height:1;color:#e8ebef}
  .day.sun .daynum{color:var(--sun)}
  .day.sat .daynum{color:var(--sat)}
  .day.holiday:not(.sat) .daynum{color:var(--sun)}
  .shift{display:flex;justify-content:center;align-items:center;min-height:26px;margin-top:0}
  .badge{min-width:32px;height:25px;padding:0 6px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:15.5px;border:1px solid transparent;background:transparent}
  .badge.duty{color:rgba(255,159,67,.82);background:transparent;border-color:transparent}
  .badge.rest{color:rgba(255,94,126,.80);background:transparent;border-color:transparent}
  .badge.work{color:rgba(85,170,255,.78);background:transparent;border-color:transparent}
  .badge.off{color:rgba(213,106,114,.82);background:transparent;border-color:transparent}
  .holiday-name{margin:0;min-height:12px;padding:0;text-align:center;color:var(--sun);font-size:8px;font-weight:700;line-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* [재설립] 개인 일정 표시 레이어. 이 영역의 탭만 일정 편집기를 열며 기존 셀 탭 토스트는 그대로 유지. */
  .personal-slot{min-width:0;min-height:0;overflow:hidden;border-top:1px solid rgba(137,147,159,.15);padding:2px 1px 0;display:flex;flex-direction:column;justify-content:flex-start;gap:0;cursor:pointer}
  .personal-empty{height:100%;min-height:16px;display:flex;align-items:center;justify-content:center;color:#7f8c99;font-size:9.5px;font-weight:750;line-height:1;opacity:.95;letter-spacing:-.03em}
  .personal-line{min-width:0;color:var(--personal);font-size:8.5px;font-weight:650;line-height:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
  .personal-time{color:var(--personal-muted);font-variant-numeric:tabular-nums;margin-right:2px}
  .personal-more{color:#738292;font-size:8px;font-weight:750;line-height:10px;white-space:nowrap;text-align:right;padding-right:1px}

  .legend{flex:0 0 auto;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:10px 8px 1px;color:var(--muted);font-size:13px}
  .legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:8px;height:8px;border-radius:50%}.d1{background:var(--duty)}.d2{background:var(--rest)}.d3{background:var(--work)}.d4{background:var(--off)}
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,18px);max-width:calc(100vw - 32px);padding:11px 15px;border-radius:13px;background:rgba(30,36,44,.96);border:1px solid rgba(255,255,255,.13);box-shadow:0 8px 30px rgba(0,0,0,.34);color:#fff;font-size:13px;font-weight:700;letter-spacing:-.02em;opacity:0;pointer-events:none;transition:opacity .16s ease,transform .16s ease;z-index:1000;text-align:center;white-space:nowrap}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* [재설립] 개인 일정 편집 오버레이 */
  .personal-overlay{position:fixed;inset:0;z-index:1200;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:0}
  .personal-overlay.open{display:flex}
  .personal-sheet{width:min(100%,720px);max-height:min(82dvh,760px);background:#11161c;border:1px solid #2b3540;border-bottom:0;border-radius:20px 20px 0 0;box-shadow:0 -18px 55px rgba(0,0,0,.48);display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
  .personal-head{flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:15px 16px 12px;border-bottom:1px solid var(--line)}
  .personal-head-text{min-width:0}
  .personal-date-title{margin:0;font-size:19px;font-weight:850;letter-spacing:-.035em;line-height:1.25}
  .personal-duty-info{margin-top:4px;color:var(--muted);font-size:11.5px;font-weight:650;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .personal-close{flex:0 0 auto;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:var(--panel2);color:var(--text);font-size:18px;font-weight:700;line-height:1;cursor:pointer}
  .personal-body{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:13px 14px 18px}
  .personal-list{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .personal-list-empty{padding:12px 10px;border:1px dashed #2e3945;border-radius:12px;color:#74808d;font-size:12.5px;text-align:center}
  .personal-card{border:1px solid #2a333d;border-radius:13px;background:#151b22;padding:10px 10px 9px}
  .personal-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .personal-card-main{min-width:0;flex:1 1 auto}
  .personal-card-title{font-size:14px;font-weight:800;line-height:1.35;word-break:break-word}
  .personal-card-time{display:inline-block;margin-right:6px;color:#9eacba;font-size:12px;font-weight:750;font-variant-numeric:tabular-nums}
  .personal-card-memo{margin-top:4px;color:#aeb8c2;font-size:12px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .personal-card-actions{flex:0 0 auto;display:flex;gap:5px}
  .personal-mini-btn{border:1px solid #303b47;border-radius:9px;background:#1a2129;color:#cdd5dd;font-size:11px;font-weight:750;padding:6px 8px;cursor:pointer}
  .personal-mini-btn.delete{color:#e0949a}
  .personal-form{border-top:1px solid var(--line);padding-top:13px}
  .personal-form-title{font-size:13px;font-weight:800;margin-bottom:8px;color:#dbe1e7}
  .personal-row{display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px;margin-bottom:8px}
  .personal-field{width:100%;border:1px solid #303a45;border-radius:11px;background:#0e1318;color:var(--text);font:inherit;font-size:14px;outline:none;padding:10px 11px}
  .personal-field:focus{border-color:#607487;box-shadow:0 0 0 2px rgba(96,116,135,.18)}
  textarea.personal-field{min-height:76px;resize:vertical;line-height:1.45;margin-bottom:9px}
  .personal-form-actions{display:flex;gap:8px}
  .personal-save{flex:1 1 auto;border:1px solid #49657d;border-radius:11px;background:#1c3447;color:#e8f4ff;font-size:14px;font-weight:850;padding:10px 12px;cursor:pointer}
  .personal-cancel{display:none;flex:0 0 auto;border:1px solid #343e49;border-radius:11px;background:#171d24;color:#b5bec8;font-size:13px;font-weight:750;padding:10px 12px;cursor:pointer}
  .personal-cancel.show{display:block}
  body.personal-open .calendar{touch-action:auto}

  @media (min-width:600px){
    .app{padding-left:16px;padding-right:16px}
    h1{font-size:26px}
    .monthtitle{font-size:23px}
    .day{padding:3px 5px 2px;grid-template-rows:24px 28px 13px minmax(0,1fr)}
    .daynumrow{min-height:24px}.daynum{min-width:27px;height:24px;font-size:14.5px}
    .shift{min-height:28px;margin-top:0}.badge{min-width:36px;height:27px;font-size:16.5px;padding:0 8px}
    .holiday-name{font-size:9px;min-height:13px;line-height:13px;padding:0}
    .personal-line{font-size:9.5px;line-height:12px}.personal-more{font-size:8.5px;line-height:11px}
    .personal-sheet{margin-bottom:0}
  }
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <h1>통수본</h1>
    <div class="team-wrap">
      <select id="teamSelect" aria-label="팀 선택">
        <option value="1">1팀</option><option value="2">2팀</option><option value="3">3팀</option><option value="4">4팀</option>
        <option value="5">5팀</option><option value="6">6팀</option><option value="7">7팀</option><option value="8">8팀</option>
        <option value="9">9팀</option><option value="10">10팀</option><option value="11">11팀</option><option value="12">12팀</option>
      </select>
    </div>
  </div>

  <div class="monthbar">
    <div class="monthspacer" aria-hidden="true"></div>
    <div class="monthcenter">
      <div class="monthtitle" id="monthTitle"></div>
    </div>
    <button class="todaybtn is-hidden" id="todayBtn">오늘로 돌아가기</button>
  </div>

  <section class="calendar" id="calendar" aria-label="근무 달력">
    <div class="weekdays">
      <div class="weekday sun">일</div><div class="weekday">월</div><div class="weekday">화</div><div class="weekday">수</div><div class="weekday">목</div><div class="weekday">금</div><div class="weekday sat">토</div>
    </div>
    <div class="month-viewport" id="monthViewport">
      <div class="month-track" id="monthTrack"></div>
    </div>
  </section>

  <div class="legend" aria-label="근무 표시">
    <span><i class="dot d1"></i>당</span><span><i class="dot d2"></i>휴</span><span><i class="dot d3"></i>일</span><span><i class="dot d4"></i>비</span>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- [재설립] 개인 일정 전용 오버레이. 근무표 DOM과 분리 -->
<div class="personal-overlay" id="personalOverlay" aria-hidden="true">
  <section class="personal-sheet" role="dialog" aria-modal="true" aria-labelledby="personalDateTitle">
    <div class="personal-head">
      <div class="personal-head-text">
        <h2 class="personal-date-title" id="personalDateTitle"></h2>
        <div class="personal-duty-info" id="personalDutyInfo"></div>
      </div>
      <button type="button" class="personal-close" id="personalClose" aria-label="닫기">×</button>
    </div>
    <div class="personal-body">
      <div class="personal-list" id="personalList"></div>
      <div class="personal-form">
        <div class="personal-form-title" id="personalFormTitle">일정 추가</div>
        <div class="personal-row">
          <input class="personal-field" id="personalTime" type="time" aria-label="시간" />
          <input class="personal-field" id="personalTitle" type="text" maxlength="80" placeholder="일정 또는 메모 제목" aria-label="제목" />
        </div>
        <textarea class="personal-field" id="personalMemo" maxlength="1000" placeholder="메모 (선택)" aria-label="메모"></textarea>
        <div class="personal-form-actions">
          <button type="button" class="personal-save" id="personalSave">저장</button>
          <button type="button" class="personal-cancel" id="personalCancel">수정 취소</button>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
  'use strict';

  const teamSelect = document.getElementById('teamSelect');
  const calendar = document.getElementById('calendar');
  const monthViewport = document.getElementById('monthViewport');
  const monthTrack = document.getElementById('monthTrack');
  const monthTitle = document.getElementById('monthTitle');
  const todayBtn = document.getElementById('todayBtn');
  const toast = document.getElementById('toast');

  // [재설립] 개인 일정 UI 참조
  const personalOverlay = document.getElementById('personalOverlay');
  const personalDateTitle = document.getElementById('personalDateTitle');
  const personalDutyInfo = document.getElementById('personalDutyInfo');
  const personalClose = document.getElementById('personalClose');
  const personalList = document.getElementById('personalList');
  const personalFormTitle = document.getElementById('personalFormTitle');
  const personalTime = document.getElementById('personalTime');
  const personalTitle = document.getElementById('personalTitle');
  const personalMemo = document.getElementById('personalMemo');
  const personalSave = document.getElementById('personalSave');
  const personalCancel = document.getElementById('personalCancel');

  const now = new Date();
  let viewYear = now.getFullYear();
  let viewMonth = now.getMonth();

  const savedTeam = Number(localStorage.getItem('tongsu_team'));
  let selectedTeam = (savedTeam >= 1 && savedTeam <= 12) ? savedTeam : 11;
  teamSelect.value = String(selectedTeam);

  // 근무 계산 엔진 R2 — 기존 검증본 유지.
  const TEAM_RULES = {
    1:{dutyAnchor:'2026-09-22'}, 2:{dutyAnchor:'2026-09-23'}, 3:{dutyAnchor:'2026-09-24'},
    4:{dutyAnchor:'2026-09-25'}, 5:{dutyAnchor:'2026-09-26'}, 6:{dutyAnchor:'2026-09-21'},
    7:{dutyAnchor:'2026-09-22'}, 8:{dutyAnchor:'2026-09-23'}, 9:{dutyAnchor:'2026-09-24'},
    10:{dutyAnchor:'2026-09-25'}, 11:{dutyAnchor:'2026-09-26'}, 12:{dutyAnchor:'2026-09-21'}
  };

  const OFFICIAL_HISTORY = {
    1:{'2026-09-20':'비','2026-09-21':'일','2026-09-22':'당','2026-09-23':'휴','2026-09-24':'비','2026-09-25':'비'},
    2:{'2026-09-20':'비','2026-09-21':'일','2026-09-22':'일','2026-09-23':'당','2026-09-24':'휴','2026-09-25':'비'},
    3:{'2026-09-20':'비','2026-09-21':'일','2026-09-22':'일','2026-09-23':'일','2026-09-24':'당','2026-09-25':'휴'},
    4:{'2026-09-20':'휴','2026-09-21':'일','2026-09-22':'일','2026-09-23':'일','2026-09-24':'비','2026-09-25':'당'},
    5:{'2026-09-20':'당','2026-09-21':'휴','2026-09-22':'일','2026-09-23':'일','2026-09-24':'비','2026-09-25':'비'},
    6:{'2026-09-20':'비','2026-09-21':'당','2026-09-22':'휴','2026-09-23':'일','2026-09-24':'비','2026-09-25':'비'},
    7:{'2026-09-20':'비','2026-09-21':'일','2026-09-22':'당','2026-09-23':'휴','2026-09-24':'비','2026-09-25':'비'},
    8:{'2026-09-20':'비','2026-09-21':'일','2026-09-22':'일','2026-09-23':'당','2026-09-24':'휴','2026-09-25':'비'},
    9:{'2026-09-20':'휴','2026-09-21':'일','2026-09-22':'일','2026-09-23':'일','2026-09-24':'당','2026-09-25':'휴'},
    10:{'2026-09-20':'당','2026-09-21':'휴','2026-09-22':'일','2026-09-23':'일','2026-09-24':'비','2026-09-25':'당'},
    11:{'2026-09-20':'비','2026-09-21':'일','2026-09-22':'일','2026-09-23':'일','2026-09-24':'비','2026-09-25':'비'},
    12:{'2026-09-20':'비','2026-09-21':'당','2026-09-22':'휴','2026-09-23':'일','2026-09-24':'비','2026-09-25':'비'}
  };

  // 공휴일 엔진 R2 — 기존 검증본 유지.
  const SPECIAL_HOLIDAYS = {
    '2026-06-03':{label:'선거일',name:'전국동시지방선거일'}
  };

  const HOLIDAY_CACHE = new Map();
  const HOLIDAY_DAY_MS = 86400000;
  const LUNAR_FORMATTER = (()=>{
    try{
      return new Intl.DateTimeFormat('en-u-ca-chinese',{
        year:'numeric',month:'numeric',day:'numeric',timeZone:'Asia/Seoul'
      });
    }catch(_){
      return null;
    }
  })();

  function holidayDateKeyFromUtcMs(ms){
    const d = new Date(ms);
    return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
  }

  function holidayAddDays(key,days){
    const [y,m,d] = key.split('-').map(Number);
    return holidayDateKeyFromUtcMs(Date.UTC(y,m-1,d) + days * HOLIDAY_DAY_MS);
  }

  function holidayWeekday(key){
    const [y,m,d] = key.split('-').map(Number);
    return new Date(Date.UTC(y,m-1,d)).getUTCDay();
  }

  function lunarPartsForSolar(y,m,d){
    if (!LUNAR_FORMATTER) return null;
    const probe = new Date(Date.UTC(y,m,d,3));
    const parts = LUNAR_FORMATTER.formatToParts(probe);
    const get = type => parts.find(p=>p.type===type)?.value ?? '';
    return {month:get('month'),day:Number(get('day')),year:Number(get('relatedYear') || get('year'))};
  }

  function findSolarForLunar(gregorianYear,lunarMonth,lunarDay,startMonth,endMonth){
    const start = Date.UTC(gregorianYear,startMonth-1,1);
    const end = Date.UTC(gregorianYear,endMonth,0);
    for(let ms=start; ms<=end; ms+=HOLIDAY_DAY_MS){
      const d = new Date(ms);
      const lp = lunarPartsForSolar(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());
      if (!lp) break;
      if (lp.year===gregorianYear && lp.month===String(lunarMonth) && lp.day===lunarDay){
        return holidayDateKeyFromUtcMs(ms);
      }
    }
    return null;
  }

  function mergeHolidayDisplay(map,key,label,name){
    const prev = map.get(key);
    if (!prev){
      map.set(key,{label,name});
      return;
    }
    const names = new Set(String(prev.name).split(' · ').concat([name]));
    prev.name = Array.from(names).join(' · ');
    if (!prev.label) prev.label = label;
  }

  function generateHolidayYear(year){
    if (HOLIDAY_CACHE.has(year)) return HOLIDAY_CACHE.get(year);
    const display = new Map();
    HOLIDAY_CACHE.set(year,display);

    if (year < 2026) return display;

    const base = [];
    let seq = 0;
    const addBase = (key,label,name,policy='none',group=null)=>{
      if (!key) return;
      base.push({id:`${year}:${++seq}`,key,label,name,policy,group});
      mergeHolidayDisplay(display,key,label,name);
    };

    addBase(`${year}-01-01`,'신정','1월 1일','none');
    addBase(`${year}-03-01`,'3·1절','3·1절','weekend');
    addBase(`${year}-05-01`,'노동절','노동절','weekend');
    addBase(`${year}-05-05`,'어린이날','어린이날','weekend');
    addBase(`${year}-06-06`,'현충일','현충일','none');
    addBase(`${year}-07-17`,'제헌절','제헌절','weekend');
    addBase(`${year}-08-15`,'광복절','광복절','weekend');
    addBase(`${year}-10-03`,'개천절','개천절','weekend');
    addBase(`${year}-10-09`,'한글날','한글날','weekend');
    addBase(`${year}-12-25`,'성탄절','기독탄신일','weekend');

    const seollal = findSolarForLunar(year,1,1,1,3);
    if (seollal){
      addBase(holidayAddDays(seollal,-1),'설연휴','설날 연휴','group','seollal');
      addBase(seollal,'설날','설날','group','seollal');
      addBase(holidayAddDays(seollal,1),'설연휴','설날 연휴','group','seollal');
    }

    const buddha = findSolarForLunar(year,4,8,4,6);
    if (buddha) addBase(buddha,'부처님오신날','부처님오신날','weekend');

    const chuseok = findSolarForLunar(year,8,15,8,10);
    if (chuseok){
      addBase(holidayAddDays(chuseok,-1),'연휴','추석 연휴','group','chuseok');
      addBase(chuseok,'추석','추석','group','chuseok');
      addBase(holidayAddDays(chuseok,1),'연휴','추석 연휴','group','chuseok');
    }

    for (const [key,info] of Object.entries(SPECIAL_HOLIDAYS)){
      if (Number(key.slice(0,4))===year) addBase(key,info.label,info.name,'none');
    }

    const byKey = new Map();
    for (const rec of base){
      if (!byKey.has(rec.key)) byKey.set(rec.key,[]);
      byKey.get(rec.key).push(rec);
    }

    const triggers = [];
    const triggered = new Set();
    const pushTrigger = (id,anchor,source)=>{
      if (triggered.has(id)) return;
      triggered.add(id);
      triggers.push({anchor,source});
    };

    for (const rec of base){
      const wd = holidayWeekday(rec.key);
      if (rec.policy==='weekend' && (wd===0 || wd===6)){
        pushTrigger(`weekend:${rec.id}`,rec.key,rec.name);
      }
    }

    for (const [key,records] of byKey.entries()){
      const wd = holidayWeekday(key);
      if (wd===0 || wd===6 || records.length < 2) continue;
      const eligible = records.filter(r=>r.policy!=='none');
      if (!eligible.length) continue;
      const source = Array.from(new Set(eligible.map(r=>r.name))).join(' · ');
      pushTrigger(`collision-date:${key}`,key,source);
    }

    for (const group of ['seollal','chuseok']){
      const members = base.filter(r=>r.group===group);
      const sunday = members.find(r=>holidayWeekday(r.key)===0);
      if (sunday){
        pushTrigger(`group-sunday:${group}`,sunday.key,group==='seollal' ? '설날' : '추석');
      }
    }

    triggers.sort((a,b)=>a.anchor.localeCompare(b.anchor));

    const occupied = new Set(base.map(r=>r.key));
    for (const trig of triggers){
      let candidate = holidayAddDays(trig.anchor,1);
      while (true){
        const wd = holidayWeekday(candidate);
        if (wd!==0 && wd!==6 && !occupied.has(candidate)) break;
        candidate = holidayAddDays(candidate,1);
      }
      occupied.add(candidate);
      mergeHolidayDisplay(display,candidate,'대체휴일',`${trig.source} 대체공휴일`);
    }

    return display;
  }

  const DAY_MS = 86400000;
  const historyStart = '2026-09-20';
  const formulaStart = '2026-09-26';

  function pad(n){ return String(n).padStart(2,'0'); }
  function keyOf(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
  function utcDayFromKey(key){
    const [y,m,d] = key.split('-').map(Number);
    return Math.floor(Date.UTC(y,m-1,d) / DAY_MS);
  }
  function mod(n,m){ return ((n % m) + m) % m; }
  function holidayForKey(key){
    const year = Number(key.slice(0,4));
    return generateHolidayYear(year).get(key) || generateHolidayYear(year-1).get(key) || null;
  }

  function shiftForDate(team, y, m, d){
    const key = keyOf(y,m,d);
    if (key < historyStart) return '';

    if (key < formulaStart) return OFFICIAL_HISTORY[team]?.[key] ?? '';

    const rule = TEAM_RULES[team];
    if (!rule) return '';

    const delta = utcDayFromKey(key) - utcDayFromKey(rule.dutyAnchor);
    const phase = mod(delta, 6);
    if (phase === 0) return '당';
    if (phase === 1) return '휴';

    const weekday = new Date(y,m,d).getDay();
    if (weekday === 0 || weekday === 6 || holidayForKey(key)) return '비';
    return '일';
  }

  function badgeClass(shift){
    return shift === '당' ? 'duty' : shift === '휴' ? 'rest' : shift === '일' ? 'work' : 'off';
  }

  function dutyTeamsForDate(y,m,d){
    const teams = [];
    for(let team=1; team<=12; team++){
      if(shiftForDate(team,y,m,d) === '당') teams.push(team);
    }
    return teams;
  }

  function isToday(y,m,d){
    return y === now.getFullYear() && m === now.getMonth() && d === now.getDate();
  }

  function shiftedMonth(y,m,delta){
    const date = new Date(y,m + delta,1);
    return {year:date.getFullYear(),month:date.getMonth()};
  }

  let toastTimer = null;
  function showToast(message,duration=1900){
    toast.textContent = message;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('show'),duration);
  }

  function showToastForDate(y,m,d){
    const key = keyOf(y,m,d);
    const holiday = holidayForKey(key);
    const dutyTeams = dutyTeamsForDate(y,m,d);
    const parts = [`${m+1}월 ${d}일`];
    if (holiday) parts.push(holiday.name);
    if (dutyTeams.length) parts.push(`당직 ${dutyTeams.map(t=>`${t}팀`).join(' · ')}`);
    else parts.push('당직 정보 없음');
    showToast(parts.join(' · '));
  }

  /* =========================================================
     [국소 제거 및 재설립] 개인 일정 저장소
     - 근무표/공휴일 엔진과 데이터 완전 분리
     - 같은 주소를 쓰더라도 각 브라우저 localStorage에만 저장
     ========================================================= */
  const PERSONAL_STORAGE_KEY = 'tongsu_personal_schedule_v1';

  function freshPersonalStore(){
    return {schema:1,updatedAt:null,dates:{}};
  }

  function normalizePersonalStore(value){
    if (!value || typeof value !== 'object') return freshPersonalStore();
    const dates = value.dates && typeof value.dates === 'object' ? value.dates : {};
    const cleanDates = {};
    for (const [key,list] of Object.entries(dates)){
      if (!/^\d{4}-\d{2}-\d{2}$/.test(key) || !Array.isArray(list)) continue;
      const clean = list.filter(item=>item && typeof item === 'object').map(item=>({
        id:String(item.id || makePersonalId()),
        time:typeof item.time === 'string' ? item.time.slice(0,5) : '',
        title:typeof item.title === 'string' ? item.title.slice(0,80) : '',
        memo:typeof item.memo === 'string' ? item.memo.slice(0,1000) : '',
        createdAt:typeof item.createdAt === 'string' ? item.createdAt : new Date().toISOString(),
        updatedAt:typeof item.updatedAt === 'string' ? item.updatedAt : new Date().toISOString()
      })).filter(item=>item.title.trim() || item.memo.trim());
      if (clean.length) cleanDates[key] = clean;
    }
    return {schema:1,updatedAt:value.updatedAt || null,dates:cleanDates};
  }

  function loadPersonalStore(){
    try{
      const raw = localStorage.getItem(PERSONAL_STORAGE_KEY);
      return raw ? normalizePersonalStore(JSON.parse(raw)) : freshPersonalStore();
    }catch(_){
      return freshPersonalStore();
    }
  }

  let personalStore = loadPersonalStore();

  function savePersonalStore(){
    personalStore.updatedAt = new Date().toISOString();
    localStorage.setItem(PERSONAL_STORAGE_KEY,JSON.stringify(personalStore));
  }

  function makePersonalId(){
    return `P${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`;
  }

  function personalItemsForKey(key){
    const source = Array.isArray(personalStore.dates[key]) ? personalStore.dates[key] : [];
    return source.slice().sort((a,b)=>{
      const at = a.time || '99:99';
      const bt = b.time || '99:99';
      if (at !== bt) return at.localeCompare(bt);
      return String(a.createdAt).localeCompare(String(b.createdAt));
    });
  }

  function personalDisplayText(item){
    const title = String(item.title || '').trim();
    if (title) return title;
    const memo = String(item.memo || '').trim().replace(/\s+/g,' ');
    return memo || '메모';
  }

  function renderPersonalSlot(slot,key){
    slot.innerHTML = '';
    const items = personalItemsForKey(key);
    if (!items.length){
      const empty = document.createElement('div');
      empty.className = 'personal-empty';
      empty.textContent = '메모 +';
      slot.appendChild(empty);
      return;
    }

    const visible = items.slice(0,2);
    for (const item of visible){
      const line = document.createElement('div');
      line.className = 'personal-line';
      if (item.time){
        const time = document.createElement('span');
        time.className = 'personal-time';
        time.textContent = item.time;
        line.appendChild(time);
      }
      const textNode = document.createTextNode(personalDisplayText(item));
      line.appendChild(textNode);
      slot.appendChild(line);
    }
    if (items.length > 2){
      const more = document.createElement('div');
      more.className = 'personal-more';
      more.textContent = `+${items.length - 2}`;
      slot.appendChild(more);
    }
  }

  let activePersonalDateKey = null;
  let editingPersonalId = null;

  function parseKey(key){
    const [y,m,d] = key.split('-').map(Number);
    return {y,m,d,date:new Date(y,m-1,d)};
  }

  function weekdayKo(date){
    return ['일','월','화','수','목','금','토'][date.getDay()];
  }

  function resetPersonalForm(){
    editingPersonalId = null;
    personalTime.value = '';
    personalTitle.value = '';
    personalMemo.value = '';
    personalFormTitle.textContent = '일정 추가';
    personalSave.textContent = '저장';
    personalCancel.classList.remove('show');
  }

  function renderPersonalList(){
    personalList.innerHTML = '';
    if (!activePersonalDateKey) return;
    const items = personalItemsForKey(activePersonalDateKey);
    if (!items.length){
      const empty = document.createElement('div');
      empty.className = 'personal-list-empty';
      empty.textContent = '등록된 개인 일정이 없습니다.';
      personalList.appendChild(empty);
      return;
    }

    for (const item of items){
      const card = document.createElement('article');
      card.className = 'personal-card';

      const top = document.createElement('div');
      top.className = 'personal-card-top';

      const main = document.createElement('div');
      main.className = 'personal-card-main';

      const title = document.createElement('div');
      title.className = 'personal-card-title';
      if (item.time){
        const time = document.createElement('span');
        time.className = 'personal-card-time';
        time.textContent = item.time;
        title.appendChild(time);
      }
      title.appendChild(document.createTextNode(personalDisplayText(item)));
      main.appendChild(title);

      if (item.memo && item.memo.trim()){
        const memo = document.createElement('div');
        memo.className = 'personal-card-memo';
        memo.textContent = item.memo.trim();
        main.appendChild(memo);
      }

      const actions = document.createElement('div');
      actions.className = 'personal-card-actions';

      const edit = document.createElement('button');
      edit.type = 'button';
      edit.className = 'personal-mini-btn';
      edit.textContent = '수정';
      edit.addEventListener('click',()=>startPersonalEdit(item.id));

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'personal-mini-btn delete';
      del.textContent = '삭제';
      del.addEventListener('click',()=>deletePersonalItem(item.id));

      actions.append(edit,del);
      top.append(main,actions);
      card.appendChild(top);
      personalList.appendChild(card);
    }
  }

  function openPersonalEditor(key){
    activePersonalDateKey = key;
    resetPersonalForm();
    const {y,m,d,date} = parseKey(key);
    personalDateTitle.textContent = `${y}년 ${m}월 ${d}일 (${weekdayKo(date)})`;
    const holiday = holidayForKey(key);
    const dutyTeams = dutyTeamsForDate(y,m-1,d);
    const info = [];
    if (holiday) info.push(holiday.name);
    if (dutyTeams.length) info.push(`당직 ${dutyTeams.map(t=>`${t}팀`).join(' · ')}`);
    personalDutyInfo.textContent = info.length ? info.join(' · ') : '개인 일정';
    renderPersonalList();
    personalOverlay.classList.add('open');
    personalOverlay.setAttribute('aria-hidden','false');
    document.body.classList.add('personal-open');
  }

  function closePersonalEditor(){
    personalOverlay.classList.remove('open');
    personalOverlay.setAttribute('aria-hidden','true');
    document.body.classList.remove('personal-open');
    activePersonalDateKey = null;
    resetPersonalForm();
  }

  function startPersonalEdit(id){
    if (!activePersonalDateKey) return;
    const items = personalStore.dates[activePersonalDateKey] || [];
    const item = items.find(x=>x.id===id);
    if (!item) return;
    editingPersonalId = id;
    personalTime.value = item.time || '';
    personalTitle.value = item.title || '';
    personalMemo.value = item.memo || '';
    personalFormTitle.textContent = '일정 수정';
    personalSave.textContent = '수정 저장';
    personalCancel.classList.add('show');
    personalTitle.focus({preventScroll:false});
  }

  function deletePersonalItem(id){
    if (!activePersonalDateKey) return;
    if (!confirm('이 개인 일정을 삭제할까요?')) return;
    const list = personalStore.dates[activePersonalDateKey] || [];
    personalStore.dates[activePersonalDateKey] = list.filter(item=>item.id!==id);
    if (!personalStore.dates[activePersonalDateKey].length) delete personalStore.dates[activePersonalDateKey];
    savePersonalStore();
    if (editingPersonalId===id) resetPersonalForm();
    renderPersonalList();
    buildMonthTrack();
    showToast('개인 일정을 삭제했습니다.',1300);
  }

  function savePersonalItem(){
    if (!activePersonalDateKey) return;
    const time = personalTime.value.trim();
    const title = personalTitle.value.trim();
    const memo = personalMemo.value.trim();
    if (!title && !memo){
      showToast('일정 또는 메모 내용을 입력하세요.',1600);
      personalTitle.focus();
      return;
    }

    const list = personalStore.dates[activePersonalDateKey] || [];
    const nowIso = new Date().toISOString();
    const wasEditing = Boolean(editingPersonalId);
    if (editingPersonalId){
      const item = list.find(x=>x.id===editingPersonalId);
      if (item){
        item.time = time;
        item.title = title;
        item.memo = memo;
        item.updatedAt = nowIso;
      }
    }else{
      list.push({id:makePersonalId(),time,title,memo,createdAt:nowIso,updatedAt:nowIso});
    }
    personalStore.dates[activePersonalDateKey] = list;
    savePersonalStore();
    resetPersonalForm();
    renderPersonalList();
    buildMonthTrack();
    showToast(wasEditing ? '개인 일정을 수정했습니다.' : '개인 일정을 저장했습니다.',1300);
  }

  personalClose.addEventListener('click',closePersonalEditor);
  personalOverlay.addEventListener('click',e=>{
    if (e.target===personalOverlay) closePersonalEditor();
  });
  personalSave.addEventListener('click',savePersonalItem);
  personalCancel.addEventListener('click',resetPersonalForm);
  window.addEventListener('keydown',e=>{
    if (e.key==='Escape' && personalOverlay.classList.contains('open')) closePersonalEditor();
  });

  let suppressTapUntil = 0;

  function createMonthPage(pageYear,pageMonth){
    const page = document.createElement('div');
    page.className = 'month-page';
    page.dataset.year = String(pageYear);
    page.dataset.month = String(pageMonth);

    const grid = document.createElement('div');
    grid.className = 'grid';
    const first = new Date(pageYear,pageMonth,1);
    const startOffset = first.getDay();
    const start = new Date(pageYear,pageMonth,1 - startOffset);

    for(let i=0;i<42;i++){
      const date = new Date(start.getFullYear(),start.getMonth(),start.getDate() + i);
      const y = date.getFullYear(), m = date.getMonth(), d = date.getDate();
      const wd = date.getDay();
      const key = keyOf(y,m,d);
      const shift = shiftForDate(selectedTeam,y,m,d);
      const holiday = holidayForKey(key);

      const cell = document.createElement('div');
      cell.className = 'day';
      cell.dataset.dateKey = key;
      if (m !== pageMonth) cell.classList.add('other');
      if (wd === 0) cell.classList.add('sun');
      if (wd === 6) cell.classList.add('sat');
      if (holiday) cell.classList.add('holiday');
      if (m === pageMonth && isToday(y,m,d)) cell.classList.add('today');

      const numRow = document.createElement('div');
      numRow.className = 'daynumrow';
      const n = document.createElement('div');
      n.className = 'daynum';
      n.textContent = d === 1 ? `${m + 1}/1` : String(d);
      numRow.appendChild(n);
      cell.appendChild(numRow);

      const wrap = document.createElement('div');
      wrap.className = 'shift';
      if (shift){
        const badge = document.createElement('span');
        badge.className = `badge ${badgeClass(shift)}`;
        badge.textContent = shift;
        wrap.appendChild(badge);
      }
      cell.appendChild(wrap);

      // [재설립] 공휴일 행을 항상 생성하여 개인일정 행의 위치를 날짜마다 고정.
      const h = document.createElement('div');
      h.className = 'holiday-name';
      h.textContent = holiday ? holiday.label : '';
      cell.appendChild(h);

      // [재설립] 개인 일정 레이어. 클릭 이벤트를 기존 날짜 셀 토스트와 분리.
      const personalSlot = document.createElement('div');
      personalSlot.className = 'personal-slot';
      personalSlot.setAttribute('role','button');
      personalSlot.setAttribute('aria-label',`${m+1}월 ${d}일 개인 일정`);
      renderPersonalSlot(personalSlot,key);
      personalSlot.addEventListener('click',e=>{
        e.stopPropagation();
        if (Date.now() < suppressTapUntil) return;
        openPersonalEditor(key);
      });
      cell.appendChild(personalSlot);

      // 기존 동작 유지: 개인 일정 영역이 아닌 날짜 셀 탭은 당직 토스트.
      cell.addEventListener('click',()=>{
        if (Date.now() < suppressTapUntil) return;
        showToastForDate(y,m,d);
      });
      grid.appendChild(cell);
    }

    page.appendChild(grid);
    return page;
  }

  function updateHeader(){
    monthTitle.textContent = `${viewYear}년 ${viewMonth + 1}월`;
    const atTodayMonth = viewYear === now.getFullYear() && viewMonth === now.getMonth();
    todayBtn.classList.toggle('is-hidden',atTodayMonth);
    todayBtn.setAttribute('aria-hidden',atTodayMonth ? 'true' : 'false');
    todayBtn.tabIndex = atTodayMonth ? -1 : 0;
  }

  function viewportHeight(){
    return Math.max(1,monthViewport.clientHeight);
  }

  function setTrackY(y,animate){
    monthTrack.style.transition = animate ? 'transform .22s cubic-bezier(.22,.72,.25,1)' : 'none';
    monthTrack.style.transform = `translate3d(0,${y}px,0)`;
  }

  function buildMonthTrack(){
    const prev = shiftedMonth(viewYear,viewMonth,-1);
    const next = shiftedMonth(viewYear,viewMonth,1);
    monthTrack.innerHTML = '';
    monthTrack.appendChild(createMonthPage(prev.year,prev.month));
    monthTrack.appendChild(createMonthPage(viewYear,viewMonth));
    monthTrack.appendChild(createMonthPage(next.year,next.month));
    updateHeader();
    requestAnimationFrame(()=>setTrackY(-viewportHeight(),false));
  }

  function applyMonthDelta(delta){
    const target = shiftedMonth(viewYear,viewMonth,delta);
    viewYear = target.year;
    viewMonth = target.month;
  }

  let animating = false;
  function commitMonth(delta){
    if (animating || delta === 0) return;
    animating = true;
    const h = viewportHeight();
    const targetY = delta > 0 ? -2 * h : 0;
    setTrackY(targetY,true);

    const finish = ()=>{
      monthTrack.removeEventListener('transitionend',finish);
      applyMonthDelta(delta);
      animating = false;
      buildMonthTrack();
    };
    monthTrack.addEventListener('transitionend',finish);
    setTimeout(()=>{
      if (!animating) return;
      monthTrack.removeEventListener('transitionend',finish);
      applyMonthDelta(delta);
      animating = false;
      buildMonthTrack();
    },320);
  }

  function snapToCurrent(){
    setTrackY(-viewportHeight(),true);
  }

  const gesture = {
    active:false,
    startX:0,
    startY:0,
    lastY:0,
    startAt:0,
    axis:null,
    dragged:false
  };

  calendar.addEventListener('touchstart',e=>{
    if (animating || personalOverlay.classList.contains('open') || e.touches.length !== 1) return;
    const t = e.touches[0];
    gesture.active = true;
    gesture.startX = t.clientX;
    gesture.startY = t.clientY;
    gesture.lastY = t.clientY;
    gesture.startAt = performance.now();
    gesture.axis = null;
    gesture.dragged = false;
    setTrackY(-viewportHeight(),false);
  },{passive:true});

  calendar.addEventListener('touchmove',e=>{
    if (!gesture.active || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - gesture.startX;
    const dy = t.clientY - gesture.startY;

    if (!gesture.axis && (Math.abs(dx) > 7 || Math.abs(dy) > 7)){
      gesture.axis = Math.abs(dy) >= Math.abs(dx) ? 'y' : 'x';
    }
    if (gesture.axis !== 'y') return;

    e.preventDefault();
    gesture.lastY = t.clientY;
    if (Math.abs(dy) > 9) gesture.dragged = true;

    const h = viewportHeight();
    const limit = h * .58;
    const clamped = Math.max(-limit,Math.min(limit,dy));
    setTrackY(-h + clamped,false);
  },{passive:false});

  function finishGesture(clientY){
    if (!gesture.active) return;
    const dy = clientY - gesture.startY;
    const elapsed = Math.max(1,performance.now() - gesture.startAt);
    const velocity = Math.abs(dy) / elapsed;
    const h = viewportHeight();
    const threshold = Math.max(52,h * .12);
    const vertical = gesture.axis === 'y';
    const shouldChange = vertical && (Math.abs(dy) >= threshold || (Math.abs(dy) >= 28 && velocity >= .45));

    if (gesture.dragged) suppressTapUntil = Date.now() + 360;
    gesture.active = false;
    gesture.axis = null;

    if (shouldChange) commitMonth(dy < 0 ? 1 : -1);
    else snapToCurrent();
  }

  calendar.addEventListener('touchend',e=>{
    if (!e.changedTouches.length) return;
    finishGesture(e.changedTouches[0].clientY);
  },{passive:true});

  calendar.addEventListener('touchcancel',()=>{
    if (!gesture.active) return;
    gesture.active = false;
    gesture.axis = null;
    snapToCurrent();
  },{passive:true});

  teamSelect.addEventListener('change',()=>{
    selectedTeam = Number(teamSelect.value);
    localStorage.setItem('tongsu_team',String(selectedTeam));
    buildMonthTrack();
  });

  todayBtn.addEventListener('click',()=>{
    if (viewYear === now.getFullYear() && viewMonth === now.getMonth()) return;
    viewYear = now.getFullYear();
    viewMonth = now.getMonth();
    buildMonthTrack();
  });

  let resizeTimer = null;
  window.addEventListener('resize',()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(()=>{
      if (!gesture.active && !animating) setTrackY(-viewportHeight(),false);
    },80);
  });

  buildMonthTrack();
})();
</script>
