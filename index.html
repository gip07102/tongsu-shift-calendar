<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0d11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="내 수사 대시보드">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-/HwhiKCdlBfAnxnf3egNZ7tVyALQ5Wowa8Dp84kWOVE=' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self' blob:; manifest-src 'self'; style-src 'sha256-16xtx7t1M3W4vDyxh13dizxiWLWAqLUQSVgdSUhJFjU='; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="caseboard-build" content="WEB_V1_8_UX6_KICS8_AIUNIFY3_OCRROW1_V3QUICK1_IOSZOOM1_PROGRESS1">
  <title>내 수사 대시보드 · 로컬 업무판</title>
  <style>:root{
  --bg:#0b0d11;--panel:#131720;--panel2:#101722;--line:#262d39;--text:#f2f4f8;
  --muted:#939cab;--blue:#5aa7ff;--blue2:#8fc4ff;--orange:#ffb454;--red:#ff646e;
  --red2:#ffd3d7;--green:#62d394;--green2:#c8f3da;--gray:#7f8998;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;touch-action:manipulation}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overscroll-behavior-y:contain}
button,input,textarea{font:inherit}
button,a,summary,label,[role="button"],.ctitle,.back,.receiptChip,.filter{touch-action:manipulation}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 30px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.title{font-size:25px;font-weight:850;letter-spacing:-.7px}
.date{font-size:11px;color:var(--muted);margin-top:4px}
.headerActions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:13px}
.actionBtn{border:1px solid #526078;background:#1d2430;color:var(--text);font-size:12px;font-weight:850;padding:9px 8px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.headerActions .actionBtn{white-space:normal;overflow-wrap:anywhere;min-height:44px;line-height:1.25;font-size:13px}
.actionBtn:active{transform:scale(.97)}
.todoToolbar{display:flex;justify-content:flex-end;gap:7px;margin:0 0 8px}
.todoToolbar .actionBtn{min-width:58px}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:14px 0 12px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 7px;text-align:center}
.metric b{display:block;font-size:20px}.metric span{font-size:11px;color:var(--muted)}
.search{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 12px;border-radius:12px;outline:none;margin-bottom:9px}
.filters{display:flex;gap:7px;overflow:auto;padding-bottom:4px;margin-bottom:7px}
.filter{white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 11px;border-radius:999px}
.filter.on{color:var(--text);border-color:#526078;background:#1d2430}
.filter[data-filter="withdrawal"]{color:var(--green);border-color:#315f48}
.filter[data-filter="withdrawal"].on{color:#d9f6e6;border-color:#3f8a63;background:#173326}
.case{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px;margin:9px 0}
.caseHead{display:flex;gap:9px;align-items:flex-start}
.ctitle{font-size:16px;font-weight:760;letter-spacing:-.25px;flex:1;min-width:0;overflow-wrap:anywhere;line-height:1.35;cursor:pointer}
.badge{font-size:11px;font-weight:700;padding:5px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.active{color:var(--blue)}.waiting{color:var(--orange)}.ready{color:var(--green)}.hold{color:var(--gray)}
.urgent{color:var(--red)}.withdrawal{color:var(--green)}.not_started{color:var(--gray)}
.meta{font-size:12px;color:var(--muted);margin:6px 0 9px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.receiptChip{border:1px solid #465064;background:#181e28;color:#dce3ed;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:760}
.receiptChip:active{transform:scale(.97)}
.row{display:grid;grid-template-columns:43px 1fr;gap:6px;font-size:13px;line-height:1.38;margin:4px 0 0}
.row .k{color:var(--muted)}
.todoSummary{color:var(--blue2)}
.stages{display:flex;gap:4px;margin:10px 0 0}.seg{height:5px;flex:1;border-radius:4px;background:#2a303a}
.seg.done{background:var(--green)}.seg.active{background:var(--blue)}
.age{font-size:11px;color:var(--muted);text-align:right;margin-top:8px}.age.warn{color:var(--orange)}.age.hot{color:var(--red);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:28px 0}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--blue);font-weight:700;cursor:pointer}
.detailNav{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.detailTitle{font-size:25px;font-weight:850;line-height:1.15;letter-spacing:-.6px}
.detailMeta{font-size:13px;color:var(--muted);margin:8px 0 14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.box{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px;margin:10px 0}
.box h3{font-size:13px;color:var(--muted);margin:0 0 9px}
.current{font-size:18px;font-weight:780;line-height:1.35}.core{font-size:13px;line-height:1.55;color:#d5dae2;margin-top:8px}
.item{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.45;padding:7px 0;border-top:1px solid #202630}
.item:first-of-type{border-top:0}.mark{width:20px;text-align:center;font-weight:900}
.mark.done{color:var(--green)}.mark.draft{color:var(--orange)}.mark.todo{color:var(--gray)}
.bigRows .item{display:grid;grid-template-columns:52px 1fr}.bigRows .mark{width:auto;color:var(--muted);font-size:12px;text-align:left}
.nextFocus{font-size:16px;font-weight:780}.waitingText{font-size:15px}
.footer{font-size:11px;color:#697383;text-align:center;padding:16px 5px 4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:#eef2f7;color:#11151c;font-size:13px;font-weight:750;padding:10px 13px;border-radius:10px;opacity:0;pointer-events:none;transition:.18s;z-index:9999;box-shadow:0 8px 30px #0008}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* TODO BOARD V2 */
.todoSection{border:1px solid var(--line);border-radius:15px;padding:10px 11px;margin:9px 0;background:var(--panel2)}
.todoSection[data-theme="red"]{border-color:#653139}
.todoSection[data-theme="green"]{border-color:#28533d}
.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 1px 8px}
.sectionTitle{font-size:15px;font-weight:850}
.todoSection[data-theme="red"] .sectionTitle{color:#ff7983}
.todoSection[data-theme="blue"] .sectionTitle{color:#7cbaff}
.todoSection[data-theme="green"] .sectionTitle{color:var(--green)}
.sectionCount{font-size:11px;color:var(--muted)}
.todoCaseGroup{border-top:1px solid #242b35;padding:8px 0}
.todoCaseGroup:first-child{border-top:0}
.todoCaseHead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:7px;align-items:center}
.todoCaseTitle{background:transparent;border:0;color:var(--text);text-align:left;font-size:14px;font-weight:760;padding:5px 2px;min-width:0;line-height:1.35;white-space:normal;overflow:hidden;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.expandBtn{border:1px solid #394455;background:#171d27;color:#d5deea;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800}
.todoTasks{padding:6px 0 0 1px}
.todoTask{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:7px;padding:7px 0;border-top:1px solid #202832;align-items:start}
.todoCheck{width:28px;height:28px;border:0;background:transparent;font-size:19px;line-height:28px;padding:0;text-align:center}
.todoText{font-size:14px;line-height:1.4;padding-top:3px}
.todoSection[data-theme="red"] .todoCheck,.todoSection[data-theme="red"] .todoText{color:var(--red2)}
.todoSection[data-theme="blue"] .todoCheck{color:#67afff}
.todoSection[data-theme="green"] .todoCheck,.todoSection[data-theme="green"] .todoText{color:var(--green2)}
.todoTask.done .todoText{opacity:.68;text-decoration:line-through;text-decoration-thickness:1px}
.sectionEmpty{font-size:12px;color:var(--muted);padding:6px 2px 8px}

/* AIUNIFY3 daily TODO schedule/progress; no redesign of existing sections. */
.dailyBoard{border:1px solid #3c5268;border-radius:15px;padding:12px;margin:0 0 11px;background:var(--panel)}
.dailyHead{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:850}
.dailyPercent{font-size:22px;font-variant-numeric:tabular-nums}
/* PROGRESS1: The number and bar share the same semantic completion state. */
.dailyBoard[data-progress="zero"] .dailyPercent{color:var(--gray)}
.dailyBoard[data-progress="partial"] .dailyPercent{color:var(--blue2)}
.dailyBoard[data-progress="complete"] .dailyPercent{color:var(--green)}
.dailyBoard[data-progress="empty"] .dailyPercent{color:var(--muted);font-size:14px}
.dailyBar{margin:9px 0 7px;height:9px;border-radius:99px;background:#2d3541;overflow:hidden}
.dailyFill{height:100%;border-radius:99px;transition:width .16s ease}
.dailyBoard[data-progress="zero"] .dailyFill{background:var(--gray)}
.dailyBoard[data-progress="partial"] .dailyFill{background:var(--blue)}
.dailyBoard[data-progress="complete"] .dailyFill{background:var(--green)}
.dailyMeta{font-size:12px;color:var(--muted);margin-bottom:8px}
.dailyRows{border-top:1px solid var(--line);margin-top:8px;padding-top:4px}
.dailyEmpty{font-size:12px;color:var(--muted);padding:7px 0 2px}
.dailyArchived{opacity:.65}
.todoDateButton{border:1px solid #42536a;border-radius:8px;background:#1b2633;color:#cad8e9;font-size:10px;padding:5px 6px;max-width:87px;min-height:30px;white-space:nowrap}
.todoDueNote{font-size:11px;color:var(--muted);margin-top:3px}
.todoDueNote.overdue{color:var(--orange)}
/* edit mode */
.editModeBanner{font-size:11px;color:#cbd7e7;margin-bottom:7px}
.editTaskList{min-height:26px}
.editTaskRow{display:grid;grid-template-columns:30px minmax(0,1fr) 84px;gap:7px;align-items:center;padding:10px 2px;border-top:1px solid #25303b;touch-action:pan-y;user-select:text;-webkit-user-select:text}
.editTaskRow:first-child{border-top:0}
.editTaskMain{min-width:0;overflow-wrap:anywhere}
.editTaskText{font-size:14px;font-weight:700;line-height:1.4}
.editTaskMeta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4;overflow-wrap:anywhere}
.orderControls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;align-self:start}
.orderBtn{min-width:0;min-height:36px;border-radius:7px;border:1px solid #485467;background:#202b39;color:#e6eef7;font-size:17px;font-weight:800;padding:3px;touch-action:manipulation}
.orderBtn:active{background:#304258}
.orderBtn:disabled{opacity:.36}
.sectionPicker{display:flex;align-items:center;gap:4px;margin-top:5px;flex-wrap:wrap}
.sectionPicker label{color:#b3c2d4;font-size:11px}
.sectionPicker select{color:#e2eaf4;background:#202935;border:1px solid #485467;border-radius:6px;max-width:100%;min-width:0;font-size:12px;padding:5px 3px;touch-action:manipulation}
.sectionPicker select:disabled{opacity:.5}
.taskPosition{font-size:11px;color:#b6c8de;padding:0 3px;white-space:nowrap}
.editOrderHint{color:#c9d5e5;font-size:11px;line-height:1.45;margin-bottom:7px}

/* receipt editor */
.overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100000}
.editorCard{width:min(520px,100%);background:#171c25;border:1px solid #3b4657;border-radius:16px;padding:15px}
.editorTitle{font-size:16px;font-weight:850;margin-bottom:10px}
.editorInput{width:100%;background:#0d1117;border:1px solid #4b586b;color:var(--text);border-radius:10px;padding:12px;font-size:16px;outline:none}
.editorActions[hidden]{display:none!important}.editorActions{display:flex;justify-content:flex-end;gap:8px;margin-top:11px}

/* detail v2 */
.detailTodoSection{margin:8px 0}
.detailTodoLabel{font-size:12px;font-weight:850;margin-bottom:4px}
.detailTodoLabel.red{color:#ff7983}.detailTodoLabel.blue{color:#7cbaff}.detailTodoLabel.green{color:var(--green)}

/* memo */
.memoCard{width:min(680px,100%);max-height:88vh;display:flex;flex-direction:column}
.memoArea{width:100%;min-height:50vh;max-height:67vh;resize:none;background:#0c1016;border:1px solid #48566a;color:var(--text);border-radius:11px;padding:12px;font-size:15px;line-height:1.5;outline:none}
.memoActions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.actionBtn:disabled{opacity:.35}


/* WEB V1 · 2/8 temporary demo status. This phase has NO persistent writes. */
.demoNotice{background:#252117;border:1px solid #785e2e;border-radius:12px;color:#ffe4ab;padding:11px 12px;font-size:12px;line-height:1.5;margin-bottom:13px}
.demoNotice b{font-weight:850}
.demoNotice small{display:block;color:#e3c991;margin-top:3px;font-size:11px}
.demoPending{background:#181f2b;border:1px solid #394a63;border-radius:12px;padding:15px;margin:12px 0;line-height:1.55}
.demoPending h2{margin:0 0 8px;font-size:16px}
.demoPending p{color:#cad2df;font-size:13px;margin:0}
:focus-visible{outline:2px solid #8fc4ff;outline-offset:2px}
@media(max-width:370px){.wrap{padding-left:9px;padding-right:9px}.headerActions{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}.headerActions .actionBtn{font-size:12px;padding:9px 5px}.editTaskRow{grid-template-columns:28px minmax(0,1fr) 76px;gap:5px}.orderBtn{min-height:36px;font-size:16px}}

/* WEB V1 3/8 saving errors */
.demoNotice small.saveError{color:#ff9aa4;font-weight:800}

.wideCard{width:min(640px,100%);max-height:85vh;overflow:auto}
.modalHeading{font-size:17px;font-weight:800;margin:0 0 12px}
.modalActions{display:flex;flex-direction:column;gap:9px}
.modalActions .actionBtn{width:100%;padding:12px;text-align:left;font-size:14px}
.smallNote{font-size:12px;line-height:1.5;color:#b2bdca;margin:6px 0 13px}
/* Save only inside local storage; transparent UI hints never claim cloud sync */
.diagnosisResult{max-height:47vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#0d1117;border:1px solid #3b4657;border-radius:10px;color:#d9e6f3;padding:11px;font-size:11px;line-height:1.45;user-select:text;-webkit-user-select:text}

.pwaBar{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;margin:0 0 11px;padding:8px 9px;border:1px solid #293647;background:#111925;border-radius:11px}
.pwaStatus{font-size:11px;color:#b3c5dc;font-weight:700;line-height:1.4;flex:1;min-width:125px}
.pwaStatus.ready{color:#91dfb5}.pwaStatus.offline{color:#ffdb94}.pwaStatus.error{color:#ff9aa4}
.pwaBtns{display:flex;gap:6px}.pwaBtns button{font-size:11px;padding:6px 8px;white-space:nowrap}
.emptyBoardHint{font-size:13px;line-height:1.6;color:var(--muted);padding:20px 11px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin:9px 0 12px}
.pwaGuide{line-height:1.6;font-size:13px;color:#d5dfee}

/* UX5: three-column HWP photo import, image and results stay on device. */
.noteEditBtn{margin-top:10px}
.modeBar{border:1px solid #344860;background:#131c28;border-radius:12px;padding:10px 12px;margin:0 0 11px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.modeBar.test{border-color:#b88734;background:#302412}
.modeBarText{min-width:0;font-size:12px;line-height:1.45;color:#cad7e7}
.modeBar.test .modeBarText{color:#ffe2a0;font-weight:800}
.modeSwitchBtn{white-space:normal;flex-shrink:0;max-width:54%;line-height:1.25;min-height:39px}
.trialClearBtn{width:100%;text-align:center;margin:0 0 10px;background:#3c271b;border-color:#88603c;color:#ffdca8}
.demoNotice.testBanner{background:#3a2a13;border-color:#d19744;color:#ffdfa0}
.demoNotice.testBanner small{color:#f4d49c}

/* KICS V2 / 3 OF 8: native-resolution user image viewer, no case changes. */
.kicsViewerCard{width:min(900px,100%);max-height:calc(100dvh - 16px);overflow:hidden;display:flex;flex-direction:column;gap:9px;padding:12px}
.kicsViewerHeader{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.kicsViewerHeader .modalHeading{margin:0;font-size:15px}
.kicsViewerHeader .actionBtn{flex:none;min-width:57px;min-height:35px}
.kicsViewerPick{flex:none;width:100%;background:#111a26;border:1px dashed #5a708e;border-radius:8px;color:#f0f5fc;padding:10px;font-size:13px}
.kicsViewerInfo{font-size:12px;color:#c5d5e8;line-height:1.5;flex:none}
.kicsViewerTools{display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;align-items:center;flex:none}
.kicsViewerTools .actionBtn{font-size:12px;min-width:35px;min-height:36px;padding:6px 9px}
.kicsViewerTools .actionBtn:disabled{opacity:.38}
.kicsViewerCounter{flex:1;min-width:90px;text-align:center;color:#d6e2ef;font-size:12px}
.kicsViewport{position:relative;flex:none;width:100%;height:clamp(220px,39dvh,460px);max-height:48dvh;background:#080d14;border:1px solid #455166;border-radius:10px;overflow:hidden;touch-action:none;overscroll-behavior:contain;user-select:none;-webkit-user-select:none;cursor:grab;contain:paint}
.kicsViewport:active{cursor:grabbing}
.kicsViewport[hidden],.kicsViewerTools[hidden],.kicsViewportEmpty[hidden]{display:none!important}
.kicsViewport img{position:absolute;display:block;max-width:none;max-height:none;transform-origin:center center;pointer-events:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;will-change:transform}
.kicsViewportEmpty{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;text-align:center;padding:20px;color:#bec9d7;font-size:13px;line-height:1.6;pointer-events:none}
.kicsViewerCollapsed{display:none;flex:none;border:1px solid #46607d;border-radius:9px;padding:9px;background:#132034;align-items:center;justify-content:space-between;gap:8px}
.kicsViewerCollapsed .actionBtn{min-height:38px}
.kicsViewerNext{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;border:1px solid #314055;background:#0c131d;border-radius:10px;padding:14px;font-size:13px;line-height:1.65;color:#cbd6e6}
.kicsViewerFoot{display:flex;justify-content:flex-end;flex:none}
@media(max-width:370px){.kicsViewerCard{padding:9px;gap:6px}.kicsViewport{height:clamp(210px,35dvh,340px)}.kicsViewerTools .actionBtn{padding:7px 6px;font-size:11px}}

body.kicsViewerActive{overflow:hidden;overscroll-behavior:none}
.kicsOverlay .kicsViewerTools{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.kicsOverlay .kicsViewerTools .actionBtn{min-width:0;max-width:100%;padding:5px 2px;min-height:32px;font-size:12px}
.kicsOverlay #kicsPrev{grid-column:1;grid-row:1}
.kicsOverlay #kicsCounter{grid-column:2 / span 4;grid-row:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kicsOverlay #kicsNext{grid-column:6;grid-row:1}
.kicsOverlay #kicsFold{grid-column:7 / span 2;grid-row:1}
.kicsOverlay #kicsZoomOut{grid-column:1 / span 2;grid-row:2}
.kicsOverlay #kicsZoomIn{grid-column:3 / span 2;grid-row:2}
.kicsOverlay #kicsRotate{grid-column:5 / span 2;grid-row:2}
.kicsOverlay #kicsResetView{grid-column:7 / span 2;grid-row:2}
/* KICS V2 / 4 OF 8: A fixed original-image pane over an independent editable list.
   All row edits in this milestone are SESSION-ONLY test drafts, never stored. */

<body>
  <div id="app" aria-live="polite"></div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module">const EMBEDDED_DEMO_FIXTURE = {"schemaVersion":3,"revision":1,"updatedAt":"2026-10-11T00:00:00+09:00","migrations":[],"board":{"memo":"","todoSections":[{"id":"urgent","label":"긴급 TODO","theme":"red","order":10},{"id":"normal","label":"일반 TODO","theme":"blue","order":20},{"id":"low","label":"후순위 TODO","theme":"blue","order":30},{"id":"withdrawal","label":"고소취소 대기","theme":"green","order":40}]},"cases":[]};

// ========= state-model =========
// WEB V1 3/8 — synthetic fixture guard, also revalidated on every IDB commit.
// WEB V1 8/8: validates device-local states including user-imported real records.
// This app does NOT embed real records in source code or send them to the server.
function assertDemoState(payload){
  if(!payload||payload.schemaVersion!==3||!Number.isInteger(payload.revision)||payload.revision<1||
     !Array.isArray(payload.cases)||!Array.isArray(payload.board?.todoSections))
    throw new Error("데이터 형식 오류: schemaVersion / cases / board");
  const sections=new Set(payload.board.todoSections.map(s=>s.id));
  if(!["urgent","normal","low","withdrawal"].every(x=>sections.has(x)))
    throw new Error("TODO 섹션 정의가 올바르지 않습니다.");
  const cases=new Set(),todos=new Set(),receipts=new Set();
  for(const c of payload.cases){
    if(!c||typeof c.caseId!=="string"||!c.caseId.trim()||typeof c.title!=="string")throw new Error("사건 식별자 오류");
    if(cases.has(c.caseId))throw new Error("중복 caseId");
    cases.add(c.caseId);
    const receipt=String(c.receiptNo||"UNKNOWN");
    if(receipt!=="UNKNOWN"){
      if(receipts.has(receipt))throw new Error("중복 접수번호");
      receipts.add(receipt);
    }
    if(!Array.isArray(c.todos)||!Array.isArray(c.todoArchive))throw new Error("TODO/보관 배열 누락");
    if(c.caseLifecycle!==undefined&&(!c.caseLifecycle||typeof c.caseLifecycle!=="object"||
       Array.isArray(c.caseLifecycle)||!["active","archived"].includes(c.caseLifecycle.state)))
      throw new Error("사건 종결 보관 상태 형식 오류");
    for(const field of ["lifecycleHistory","currentCorrectionHistory"])
      if(c[field]!==undefined&&!Array.isArray(c[field]))throw new Error("사건 상태 정정·보관 이력 형식 오류: "+field);
    for(const t of [...c.todos,...c.todoArchive]){
      if(typeof t.todoId!=="string"||!t.todoId.trim())throw new Error("TODO ID 오류");
      if(todos.has(t.todoId))throw new Error("중복 todoId");
      todos.add(t.todoId);
      if(!sections.has(t.section)||!Number.isFinite(Number(t.manualOrder)))throw new Error("TODO 정렬 데이터 오류");
      if(typeof t.done!=="boolean")throw new Error("TODO 체크 형식 오류");
      if(t.dueDate!==undefined&&t.dueDate!==""&&!dailyValidDate(t.dueDate))throw new Error("TODO 날짜 형식 오류");
    }
  }
  return structuredClone(payload);
}
async function loadDemoFixture(_path){
  return assertDemoState(structuredClone(EMBEDDED_DEMO_FIXTURE));
}


// ========= db =========
// WEB V1 3/8 — strictly local IndexedDB. No network writes, cookies, localStorage, or sync.

// UX6: distinct DATABASES, not a disposable view over live cases.
// URL flag controls only which device-local database is opened. No case data in URL.
const TEST_MODE = new URL(location.href).searchParams.get("cb_mode")==="test";
const LIVE_DB_NAME = "caseboard-local-pwa-demo-v1"; // Original production IDB name: NEVER rename.
const TRIAL_DB_NAME = "caseboard-local-pwa-trial-v1";
const DB_NAME = TEST_MODE ? TRIAL_DB_NAME : LIVE_DB_NAME;
const DB_VERSION = 1;
const STORE = "records";
const STATE_KEY = "currentState";
const UNDO_KEY = "beforeLastTodoReset";
const CASE_UNDO_KEY = "beforeLastCaseApply";
let openPromise = null;

class RevisionConflictError extends Error {
  constructor(){super("다른 화면에서 상태가 수정되었습니다. 최신 저장 상태를 다시 불러옵니다.");this.name="RevisionConflictError";}
}

function openDB(){
  if(!globalThis.indexedDB) return Promise.reject(new Error("IndexedDB를 사용할 수 없는 브라우저 환경입니다."));
  if(openPromise) return openPromise;
  openPromise = new Promise((resolve,reject)=>{
    const request=indexedDB.open(DB_NAME,DB_VERSION);
    request.onupgradeneeded=()=>{
      const db=request.result;
      if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE);
    };
    request.onsuccess=()=>{
      const db=request.result;
      db.onversionchange=()=>{db.close();openPromise=null;};
      resolve(db);
    };
    request.onerror=()=>reject(request.error||new Error("로컬 데이터베이스를 열지 못했습니다."));
    request.onblocked=()=>reject(new Error("다른 브라우저 탭이 데이터베이스 업데이트를 막고 있습니다."));
  }).catch(err=>{openPromise=null;throw err;});
  return openPromise;
}

function oneRead(db,key){
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readonly");
    const req=tx.objectStore(STORE).get(key);
    let value;
    req.onsuccess=()=>{value=req.result;};
    tx.oncomplete=()=>resolve(value);
    tx.onabort=()=>reject(tx.error||new Error("로컬 데이터 읽기가 취소되었습니다."));
    tx.onerror=()=>{};
  });
}

async function readLocalState(){
  const db=await openDB();
  const current=await oneRead(db,STATE_KEY);
  return current===undefined?null:assertDemoState(current);
}

// Seed the synthetic fixture ONLY if the object store has no state.
// get/put are in ONE readwrite transaction, so racing initial tabs cannot overwrite one another.
async function seedDemoStateIfMissing(fixture){
  const seed=assertDemoState(fixture);
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    const store=tx.objectStore(STORE);
    const req=store.get(STATE_KEY);
    let output=null;
    req.onsuccess=()=>{
      try{
        if(req.result!==undefined){output=assertDemoState(req.result);return;}
        output=structuredClone(seed);
        store.put(output,STATE_KEY);
      }catch(err){rejectOnce(err);tx.abort();}
    };
    let settled=false;
    const rejectOnce=err=>{if(!settled){settled=true;reject(err);}};
    tx.oncomplete=()=>{if(!settled){settled=true;resolve(output);}};
    tx.onabort=()=>rejectOnce(tx.error||new Error("초기 가상 데이터 저장이 취소되었습니다."));
    tx.onerror=()=>{};
  });
}

async function loadOrSeedDemoState(loadFixture){
  const existing=await readLocalState();
  if(existing!==null)return existing;
  const fixture=await loadFixture();
  return await seedDemoStateIfMissing(fixture);
}

// Atomic, revision-checked transaction. The mutator MUST be synchronous.
// Can atomically modify both state and selective-reset undo journal in stage 4.
// mutate(draft, journalApi): draft changes + journalApi.set / .clear / .current.
async function commitDemoMutation(expectedRevision,mutate){
  if(typeof mutate!=="function")throw new Error("수정함수가 필요합니다.");
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite");
    const store=tx.objectStore(STORE);
    const currentReq=store.get(STATE_KEY);
    const undoReq=store.get(UNDO_KEY);
    const caseReq=store.get(CASE_UNDO_KEY);
    let currentReady=false,undoReady=false,caseReady=false;
    let record,undoRecord,caseRecord;
    let saved,finalUndo,finalCaseUndo;
    let settled=false;
    const rejectOnce=err=>{if(!settled){settled=true;reject(err);}};
    const attempt=()=>{
      if(!currentReady||!undoReady||!caseReady)return;
      try{
        if(record===undefined)throw new Error("저장된 상태가 없습니다. 초기화 후 재시도하십시오.");
        const current=assertDemoState(record);
        if(current.revision!==expectedRevision)throw new RevisionConflictError();
        const draft=structuredClone(current);
        let undoDirty=false;
        let nextUndo=undoRecord??null;
        let caseDirty=false;
        let nextCaseUndo=caseRecord??null;
        const journalApi={
          current:()=>structuredClone(nextUndo),
          set:(value)=>{nextUndo=structuredClone(value);undoDirty=true;},
          clear:()=>{nextUndo=null;undoDirty=true;},
          caseCurrent:()=>structuredClone(nextCaseUndo),
          caseSet:(value)=>{nextCaseUndo=structuredClone(value);caseDirty=true;},
          caseClear:()=>{nextCaseUndo=null;caseDirty=true;}
        };
        const response=mutate(draft,journalApi);
        if(response && typeof response.then==="function")throw new Error("저장 트랜잭션에서 비동기 수정은 지원하지 않습니다.");
        draft.revision=current.revision+1;
        draft.updatedAt=new Date().toISOString();
        saved=assertDemoState(draft);
        store.put(saved,STATE_KEY);
        if(undoDirty){
          if(nextUndo===null)store.delete(UNDO_KEY);
          else store.put(nextUndo,UNDO_KEY);
        }
        if(caseDirty){
          if(nextCaseUndo===null)store.delete(CASE_UNDO_KEY);
          else store.put(nextCaseUndo,CASE_UNDO_KEY);
        }
        finalUndo=nextUndo;finalCaseUndo=nextCaseUndo;
      }catch(err){rejectOnce(err);try{tx.abort();}catch(_){}}
    };
    currentReq.onsuccess=()=>{record=currentReq.result;currentReady=true;attempt();};
    undoReq.onsuccess=()=>{undoRecord=undoReq.result;undoReady=true;attempt();};
    caseReq.onsuccess=()=>{caseRecord=caseReq.result;caseReady=true;attempt();};
    tx.oncomplete=()=>{if(!settled){settled=true;resolve({state:saved,undo:finalUndo,caseUndo:finalCaseUndo});}};
    tx.onabort=()=>rejectOnce(tx.error||new Error("로컬 저장 트랜잭션이 취소되었습니다."));
    tx.onerror=()=>{};
  });
}

function validateCaseUndo(j){

         item.afterCase?.caseId!==item.caseId||!Array.isArray(item.afterCase?.todos)||
         !Array.isArray(item.afterCase?.todoArchive)||
         (item.beforeCase!==null&&(item.beforeCase?.caseId!==item.caseId||
          !Array.isArray(item.beforeCase?.todos)||!Array.isArray(item.beforeCase?.todoArchive))))
        throw new Error("V2 일괄복원 기록의 사건별 변경 전후 상태가 올바르지 않습니다.");
      seen.add(item.caseId);
    }
    return structuredClone(j);
  }
  if(j.kind==="batchPatch"){
    if(j.caseId!=="BULK"||j.created!==false||!Array.isArray(j.items)||!j.items.length||j.items.length>BATCH_MAX_CHANGES)
      throw new Error("다중사건 수정 복원기록의 종류·건수가 잘못되었습니다.");
    const seen=new Set();
    for(const item of j.items){
      if(!item||typeof item.caseId!=="string"||!item.caseId||seen.has(item.caseId)||
         item.beforeCase?.caseId!==item.caseId||item.afterCase?.caseId!==item.caseId||
         !Array.isArray(item.beforeCase?.todos)||!Array.isArray(item.afterCase?.todos)||

      seen.add(item.caseId);
    }

  }
  if(j.kind==="photoBulk"){
    if(j.caseId!=="BULK"||!j.created||!Array.isArray(j.items)||!j.items.length||j.items.length>PHOTO_ROWS_LIMIT||

  if(j.beforeCase&&j.beforeCase.caseId!==j.caseId)throw new Error("사건반영 이전 상태의 식별자가 일치하지 않습니다.");

// Full replacement is ONE IndexedDB transaction. If another tab changes the current revision, abort.
async function restoreLocalBundle(bundle,expectedRevision){
  const validated=validateBackupObject({format:BACKUP_FORMAT,backupVersion:BACKUP_VERSION,...bundle});
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,"readwrite"),o=tx.objectStore(STORE);
    const req=o.get(STATE_KEY);let saved;let settled=false;
    const fail=e=>{if(!settled){settled=true;reject(e);}};
    req.onsuccess=()=>{
      try{
        const old=req.result;
        if(expectedRevision===null){if(old!==undefined)throw new RevisionConflictError();}
        else if(!old||Number(old.revision)!==expectedRevision)throw new RevisionConflictError();
        saved=structuredClone(validated.state);
        saved.revision=Math.max(old?.revision||0,saved.revision)+1;
        saved.updatedAt=new Date().toISOString();
        assertDemoState(saved);
        o.put(saved,STATE_KEY);
        if(validated.todoResetUndo)o.put(validated.todoResetUndo,UNDO_KEY);else o.delete(UNDO_KEY);
        if(validated.caseApplyUndo)o.put(validated.caseApplyUndo,CASE_UNDO_KEY);else o.delete(CASE_UNDO_KEY);
      }catch(e){fail(e);try{tx.abort();}catch(_) {}}
    };
    tx.oncomplete=()=>{if(!settled){settled=true;resolve(saved);}};
    tx.onabort=()=>fail(tx.error||new Error("백업 복원 트랜잭션이 취소되었습니다."));
  });
}

// AIUNIFY3: dueDate is optional metadata on each legacy TODO; no DB migration.
// Use device-local calendar days, not toISOString() UTC dates (Korea midnight safety).
function dailyLocalDate(value=new Date()){
  const d=value instanceof Date?value:new Date(value);
  return [d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-");
}
function dailyValidDate(s){
  if(typeof s!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;
  const d=new Date(s+"T12:00:00");return !Number.isNaN(d.getTime())&&dailyLocalDate(d)===s;
}
function dailyCompleteOn(t){
  // checkedAt comes from existing and V3 checkbox actions; old records may omit it.
  const dt=t.checkedAt;
  if(typeof dt!=="string"||!dt)return "";
  const d=new Date(dt);return Number.isNaN(d.getTime())?"":dailyLocalDate(d);
}
function dailyScopeRows(cases,today=dailyLocalDate()){
  const rows=[];
  for(const c of cases){if(v2LifeState(c)==="archived")continue;
    for(const t of [...(c.todos||[]),...(c.todoArchive||[])]){
      const due=dailyValidDate(t.dueDate)?t.dueDate:"";
      const doneToday=!!t.done&&dailyCompleteOn(t)===today;
      const dueOpen=!t.done&&!!due&&due<=today;
      // Checked on an earlier day does not count as work completed today.
      if(!dueOpen&&!doneToday)continue;
      rows.push({c,t,archived:(c.todoArchive||[]).includes(t),overdue:dueOpen&&due<today});
    }
  }
  rows.sort((a,b)=>Number(a.t.done)-Number(b.t.done)||Number(b.overdue)-Number(a.overdue)||
    String(a.t.dueDate||'').localeCompare(String(b.t.dueDate||''))||
    Number(a.t.manualOrder||0)-Number(b.t.manualOrder||0));
  return rows;
}
function dailyStats(cases,today=dailyLocalDate()){
  const rows=dailyScopeRows(cases,today);
  const completed=rows.filter(x=>x.t.done).length;
  return {today,rows,completed,total:rows.length,remaining:rows.length-completed,
    overdue:rows.filter(x=>x.overdue).length,
    percent:rows.length?Math.round(completed*100/rows.length):0};
}

  const c=draft.cases.find(x=>x.caseId===caseId);

function toggleTodo(draft,caseId,todoId){

function sortedSectionRows(draft,sectionId){
  const rows=[];
  for(const c of draft.cases){for(const t of(c.todos||[])){
    if(t.section===sectionId)rows.push({c,t});
  }}
  return rows.sort((a,b)=>Number(a.t.manualOrder)-Number(b.t.manualOrder)||String(a.t.todoId).localeCompare(String(b.t.todoId)));
}

function moveTodo(draft,caseId,todoId,targetSection,targetIndex){
  const c=draft.cases.find(x=>x.caseId===caseId);
  const t=(c?.todos||[]).find(x=>x.todoId===todoId);
  if(!t)throw new Error("이동할 TODO를 찾을 수 없습니다.");
  const ids=new Set(draft.board.todoSections.map(s=>s.id));
  if(!ids.has(targetSection))throw new Error("잘못된 TODO 구역입니다.");
  if(!Number.isInteger(targetIndex)||targetIndex<0)throw new Error("잘못된 이동 위치입니다.");
  const from=t.section;
  const destination=sortedSectionRows(draft,targetSection).filter(x=>x.t.todoId!==todoId);
  destination.splice(Math.min(targetIndex,destination.length),0,{c,t});
  t.section=targetSection;
  // Section is authoritative. Keep the companion priority/group fields coherent
  // so future CASE_BOARD_UPDATE_V1 matching does not accidentally reclassify it.
  t.group=targetSection==="withdrawal"?"withdrawal":"action";
  t.priority=targetSection==="urgent"?"urgent":targetSection==="low"?"low":"normal";
  destination.forEach((x,i)=>{
    x.t.section=targetSection;
    x.t.manualOrder=(i+1)*10;
    x.t.userPositioned=true;
  });
  if(from!==targetSection){
    sortedSectionRows(draft,from).forEach((x,i)=>{
      x.t.manualOrder=(i+1)*10;
      x.t.userPositioned=true;
    });
  }
}

function changeReceipt(draft,caseId,raw){

function appendMemoLine(memo,line){

    if(v2LifeState(c)==="archived")continue;

function performReset(draft,journal){
  const marked=draft.cases.reduce((n,c)=>n+(v2LifeState(c)==="archived"?0:c.todos.filter(t=>t.done).length),0);
  if(!marked)throw new Error("체크된 TODO가 없습니다.");
  const snapshot={};
  for(const sec of draft.board.todoSections)
    snapshot[sec.id]=sortedSectionRows(draft,sec.id).filter(x=>v2LifeState(x.c)!=="archived").map(x=>x.t.todoId);
  const resetId="RESET-"+Date.now(),now=new Date().toISOString();
  const undo={resetId,createdAt:now,removed:[],memoAdded:[],sectionSnapshots:snapshot};
  for(const c of draft.cases){
    // Archived case TODOs remain byte-identical during an unrelated global cleanup.
    if(v2LifeState(c)==="archived")continue;
    const kept=[];
    for(const t of c.todos){
      if(!t.done){kept.push(t);continue;}
      undo.removed.push({caseId:c.caseId,todo:structuredClone(t)});
      if(!t.memoLoggedAt){
        const line=todoMemoLine(c,t);
        draft.board.memo=appendMemoLine(draft.board.memo,line);
        undo.memoAdded.push({todoId:t.todoId,line});
        t.memoLoggedAt=now;

function undoReset(draft,journal){
  const previous=validateResetJournal(journal.current());
  if(!previous||!previous.removed.length)throw new Error("복원할 직전 완료정리 기록이 없습니다.");
  for(const {caseId,todo} of previous.removed){
    const c=draft.cases.find(x=>x.caseId===caseId);
    if(!c)continue;
    if(!c.todos.some(t=>t.todoId===todo.todoId))c.todos.push(structuredClone(todo));
    c.todoArchive=c.todoArchive.filter(t=>t.todoId!==todo.todoId);
  }
  // Remove only exact lines automatically added by that R operation.
  for(const {line} of previous.memoAdded){
    const pieces=draft.board.memo.split("\n");
    const pos=pieces.indexOf(line);
    if(pos>=0)pieces.splice(pos,1);
    draft.board.memo=pieces.join("\n");
  }
  for(const sec of draft.board.todoSections){
    const ranks=new Map((previous.sectionSnapshots[sec.id]||[]).map((id,i)=>[id,i]));
    const rows=sortedSectionRows(draft,sec.id).filter(x=>v2LifeState(x.c)!=="archived");
    const existing=rows.filter(x=>ranks.has(x.t.todoId)).sort((a,b)=>ranks.get(a.t.todoId)-ranks.get(b.t.todoId));
    const newRows=rows.filter(x=>!ranks.has(x.t.todoId));
    [...existing,...newRows].forEach((x,i)=>x.t.manualOrder=(i+1)*10);
  }
  journal.clear();
}

function undoCaseUpdate(draft,journal){
  const last=validateCaseUndo(journal.caseCurrent());
  if(!last)throw new Error("되돌릴 사건반영이 없습니다.");
  if(last.kind==="v2BatchPatch"){
    // Full-batch rollback only. A created case has null beforeCase and must be deleted,
    // while existing cases restore exact pre-commit snapshots. No collateral edits.
    for(const item of last.items){
      const current=draft.cases.find(c=>c.caseId===item.caseId);
      if(!current||JSON.stringify(current)!==JSON.stringify(item.afterCase))
        throw new Error("V2 갱신 후 대상 사건이 변경되어 전체 복원을 거부합니다. 새 백업을 먼저 확인하세요.");
    }
    const createdIds=new Set(last.items.filter(x=>x.beforeCase===null).map(x=>x.caseId));
    draft.cases=draft.cases.filter(c=>!createdIds.has(c.caseId));
    for(const item of last.items){
      if(item.beforeCase===null)continue;
      const index=draft.cases.findIndex(c=>c.caseId===item.caseId);
      if(index<0)throw new Error("V2 복원 대상 사건이 누락되었습니다.");
      draft.cases[index]=structuredClone(item.beforeCase);
    }
    journal.caseClear();return;
  }
  if(last.kind==="batchPatch"){
    // Every target must STILL match its saved afterCase, otherwise refuse ALL undo.
    // No unrelated case, board memo, reset undo journal, ordering or archive changes.
    for(const item of last.items){
      const current=draft.cases.find(c=>c.caseId===item.caseId);
      if(!current||JSON.stringify(current)!==JSON.stringify(item.afterCase))
        throw new Error("일괄 갱신 후 대상 사건 중 수정된 기록이 있어 전체 취소를 거부합니다. 새 백업과 변경사항을 확인하세요.");
    }
    for(const item of last.items){
      const i=draft.cases.findIndex(c=>c.caseId===item.caseId);
      if(i<0)throw new Error("복원 대상 사건이 누락되었습니다.");
      draft.cases[i]=structuredClone(item.beforeCase);
    }
    journal.caseClear();return;
  }
  if(last.kind==="photoBulk"){
    // Refuse to silently delete a batch case that has been edited since import.
    for(const item of last.items){
      const current=draft.cases.find(c=>c.caseId===item.caseId);
      if(!current||JSON.stringify(current)!==JSON.stringify(item.afterCase))
        throw new Error("일괄등록 후 수정된 사건이 있어 안전하게 일괄취소할 수 없습니다. 백업을 확인하세요.");
    }
    const ids=new Set(last.items.map(it=>it.caseId));
    draft.cases=draft.cases.filter(c=>!ids.has(c.caseId));
    journal.caseClear();return;
  }
  const i=draft.cases.findIndex(c=>c.caseId===last.caseId);
  if(last.created){if(i>=0)draft.cases.splice(i,1);}
  else if(i>=0)draft.cases[i]=structuredClone(last.beforeCase);
  else throw new Error("복구할 사건을 찾을 수 없습니다.");
  journal.caseClear();
}

const BATCH_UPDATE_TYPE="CASE_BOARD_BATCH_UPDATE_V1";

function batchObject(v,where){

  return v;

function batchKeys(v,allowed,where){

function batchString(v,where,max){
  if(typeof v!=="string"||!v.trim()||v.length>max||/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/.test(v))
    throw new Error(where+": 비어 있지 않은 "+max+"자 이하 문자열만 허용합니다.");
  return v;
}
function batchArray(v,where,max){
  if(!Array.isArray(v)||v.length>max)throw new Error(where+": 배열 최대 "+max+"건을 초과했거나 형식이 다릅니다.");
  return v;
}
function validateCaseBoardBatchPackage(input){
  const p=batchObject(input,"일괄 패키지");
  batchKeys(p,["schemaVersion","type","workspace","baseRevision","changes"],"일괄 패키지");
  if(p.schemaVersion!==1||p.type!==BATCH_UPDATE_TYPE)throw new Error("일괄 패키지 버전/type 불일치");
  if(p.workspace!=="LIVE"&&p.workspace!=="TRIAL")throw new Error("workspace는 LIVE 또는 TRIAL이어야 합니다.");
  if(!Number.isSafeInteger(p.baseRevision)||p.baseRevision<1)throw new Error("baseRevision은 1 이상의 정수여야 합니다.");

      if(receipt!==receipt.trim())throw new Error(where+": receiptNo 앞뒤 공백은 허용하지 않습니다.");
      if(receipt==="UNKNOWN")throw new Error(where+": UNKNOWN 접수번호는 대상 식별자로 사용할 수 없습니다. caseId를 사용하세요.");
      if(receipts.has(receipt))throw new Error(where+": 중복 접수번호 대상 "+receipt);

      for(const [key,value] of Object.entries(fields)){
        batchString(value,where+".set."+key,BATCH_SET_MAX_LENGTH[key]);

      if(todos.update!==undefined){

        for(const [j,rawTodo] of arr.entries()){
          const at=where+".todos.update["+j+"]",t=batchObject(rawTodo,at);

          const at=where+".append."+field+"["+j+"]";
          if(field==="timeline"){

  }
  if(added>BATCH_MAX_TODO_ADDS)throw new Error("전체 신규 TODO는 "+BATCH_MAX_TODO_ADDS+"건 이하입니다.");
  if(edited>BATCH_MAX_TODO_UPDATES)throw new Error("전체 TODO 문구 수정은 "+BATCH_MAX_TODO_UPDATES+"건 이하입니다.");
  if(appended>BATCH_MAX_APPEND_ITEMS)throw new Error("전체 추가 기록은 "+BATCH_MAX_APPEND_ITEMS+"건 이하입니다.");
  if(new TextEncoder().encode(JSON.stringify(p)).length>BATCH_MAX_BYTES)
    throw new Error("일괄 패키지가 300KiB를 초과합니다.");
  return structuredClone(p);
}

// Reject duplicate JSON keys before JSON.parse silently keeps the LAST one.
// This guards against a seemingly valid AI package secretly replacing prior fields.
function rejectDuplicateJsonKeys(jsonText){
  const stack=[];let i=0;
  while(i<jsonText.length){
    const ch=jsonText[i];
    if(ch==='"'){
      const begin=i++;let slash=false;
      while(i<jsonText.length){
        const c=jsonText[i++];
        if(slash){slash=false;continue;}
        if(c==="\\"){slash=true;continue;}
        if(c==='"')break;
      }
      if(jsonText[i-1]!=='"')throw new Error("닫히지 않은 JSON 문자열입니다.");
      const scope=stack[stack.length-1];
      if(scope?.type==='object'&&scope.expectKey){
        const key=JSON.parse(jsonText.slice(begin,i));
        if(scope.keys.has(key))throw new Error("중복 JSON 속성 "+key+" 는 허용하지 않습니다.");
        scope.keys.add(key);scope.expectKey=false;
      }
      continue;
    }
    if(ch==='{')stack.push({type:'object',expectKey:true,keys:new Set()});
    else if(ch==='[')stack.push({type:'array'});
    else if(ch==='}'||ch===']')stack.pop();
    else if(ch===','){
      const scope=stack[stack.length-1];if(scope?.type==='object')scope.expectKey=true;
    }
    i++;
  }
}
function parseCaseBoardTransport(text){
  const raw=String(text??"").trim();
  if(new TextEncoder().encode(raw).length>2*1024*1024)throw new Error("입력 크기가 2MiB를 초과합니다.");
  const start=raw.match(/^\[(CASE_BOARD_BATCH_UPDATE_V2|CASE_BOARD_BATCH_UPDATE_V1|CASE_BOARD_UPDATE_V1)\]/);
  if(!start)throw new Error("시작 표식으로 시작하는 단 하나의 CASE_BOARD_UPDATE_V1 / CASE_BOARD_BATCH_UPDATE_V1 / CASE_BOARD_BATCH_UPDATE_V2 블록이 필요합니다. 앞뒤 설명은 제거하세요.");
  const name=start[1],end="[END_"+name+"]";
  if(!raw.endsWith(end))throw new Error("끝 표식 "+end+" 뒤에 설명을 두지 말고 정확히 한 블록만 붙여넣으세요.");
  const markers=raw.match(/\[(?:END_)?CASE_BOARD_(?:BATCH_)?UPDATE_V[12]\]/g)||[];
  if(markers.length!==2||markers[0]!=="["+name+"]"||markers[1]!==end)
    throw new Error("여러 패키지·중첩 표식은 허용하지 않습니다. 한 블록만 입력하세요.");
  const jsonText=raw.slice(start[0].length,-end.length).trim();
  if(!jsonText)throw new Error("표식 사이에 JSON 본문이 없습니다.");
  if((name===BATCH_UPDATE_TYPE||name===V2_BATCH_TYPE)&&new TextEncoder().encode(raw).length>BATCH_MAX_BYTES)
    throw new Error("일괄 패키지 입력은 300KiB 이하만 허용합니다.");
  let obj;
  try{rejectDuplicateJsonKeys(jsonText);obj=JSON.parse(jsonText);}catch(e){throw new Error("JSON 문법 오류: "+String(e.message||e));}
  return name===V2_BATCH_TYPE?{kind:"batchV2",package:validateCaseBoardV2Package(obj)}:
    name===BATCH_UPDATE_TYPE?{kind:"batch",package:validateCaseBoardBatchPackage(obj)}:
    {kind:"single",package:validateDemoUpdatePackage(obj)};
}

function v2String(v,where,max,allowEmpty=false){

function v2ExactId(v,where){const s=batchString(v,where,128);if(s!==s.trim())throw new Error(where+": ID 앞뒤 공백 불가");return s;}

function validateCaseBoardV2Package(input){

          if(row.op==="replace"){

  const expected=[...usedCaps].sort();
  const declared=batchArray(pkg.requiredCapabilities,"requiredCapabilities",V2_CAPABILITIES.length);
  if(declared.some(x=>!V2_CAPABILITIES.includes(x))||declared.length!==expected.length||
     declared.some((v,i)=>v!==expected[i]))

  if(new TextEncoder().encode(JSON.stringify(pkg)).length>V2_MAX_BYTES)throw new Error("V2 패키지는 300KiB 이하이어야 합니다.");

    if(!Array.isArray(records))throw new Error(at+": 원본 "+op.field+" 배열이 없습니다.");

      if(candidates.length!==1)throw new Error(at+": 유일한 itemId 항목을 찾지 못했습니다.");
      index=candidates[0].j;

      throw new Error(at+": 현재 원본 값이 expectedValue와 다릅니다.");

      if(c.currentCorrectionHistory!==undefined)throw new Error(where+": 현재상태 정정이력 저장 형식 오류");
      c.currentCorrectionHistory=[];

function batchAppendSignature(field,value){
  if(field==="timeline"&&value&&typeof value==="object"&&!Array.isArray(value)&&
     typeof value.date==="string"&&typeof value.text==="string")
    return "timeline\u0001"+normText(value.date)+"\u0001"+normText(value.text);
  if(typeof value==="string")return "text\u0001"+normText(value);
  // Older records may use different objects; don't modify or reinterpret them.
  return "legacy\u0001"+JSON.stringify(value);
}
function resolveBatchPatchTargets(source,pkg){
  const byId=new Map(),byReceipt=new Map(),resolved=[],seen=new Set();
  source.cases.forEach((c,i)=>{
    if(byId.has(c.caseId))throw new Error("저장 상태에 중복 caseId가 있습니다.");
    byId.set(c.caseId,i);
    if(c.receiptNo&&c.receiptNo!=="UNKNOWN"){
      if(byReceipt.has(c.receiptNo))throw new Error("저장 상태에 중복 접수번호가 있습니다.");
      byReceipt.set(c.receiptNo,i);
    }

  for(const [n,change] of pkg.changes.entries()){
    const m=change.match,byCase=m.caseId!==undefined?byId.get(m.caseId):undefined;
    const byNumber=m.receiptNo!==undefined?byReceipt.get(m.receiptNo):undefined;
    if(m.caseId!==undefined&&byCase===undefined)
      throw new Error("changes["+n+"]: caseId가 정확히 일치하는 사건이 없습니다: "+m.caseId);
    if(m.receiptNo!==undefined&&byNumber===undefined)
      throw new Error("changes["+n+"]: 접수번호가 정확히 일치하는 사건이 없습니다: "+m.receiptNo);
    if(m.caseId!==undefined&&m.receiptNo!==undefined&&byCase!==byNumber)
      throw new Error("changes["+n+"]: caseId와 접수번호가 서로 다른 사건을 가리킵니다.");
    const index=m.caseId!==undefined?byCase:byNumber;
    if(seen.has(index))throw new Error("changes["+n+"]: 동일한 실제 사건을 두 번 지정했습니다. 한 건으로 합쳐 다시 발행하세요.");
    seen.add(index);

      bulk?`직전 일괄등록 ${prior.items.length}건을 한 번에 취소하시겠습니까?\n등록 후 수정된 사건이 있으면 안전상 취소되지 않습니다.`:
      "직전 사건반영 한 건만 되돌리겠습니까?";
    if(!confirm(message))return;

}

// ===== UX5: 3-column photo OCR -> review -> atomic bulk registration =====
// OCR JS/core/models are downloaded from fixed external URLs ON DEMAND; recognition
// is in the browser's WebWorker. NO photo/image/text is submitted to our server.
// OCR downloads remote engine components on demand and is not guaranteed offline.
const PHOTO_ROWS_LIMIT=120;
function validReceiptNumber(value){return /^20\d{2}-\d{6}$/.test(String(value||"").trim());}
function cleanImportText(v,limit=800){return String(v||"").replace(/[\u0000-\u001f\u007f]/g," ").replace(/\s+/g," ").trim().slice(0,limit);}
// KICS6 — photo-confirmed selected rows only; PURE validator and atomic bulk mutator.
// Calling validator never changes the current LIVE or isolated TRIAL state.
function prepareKicsRowsForBulk(drafts,existing){
  const chosen=drafts.filter(r=>r.selected);
  if(!chosen.length)throw new Error("등록 선택한 사건이 없습니다. 각 행의 '등록 선택'을 체크하세요.");
  if(chosen.length>PHOTO_ROWS_LIMIT)throw new Error("한 번에 등록 가능한 사건은 120건 이하입니다.");
  const taken=new Set(existing.map(c=>c.receiptNo).filter(Boolean));
  const prepared=[];
  for(const row of chosen){
    if(!row.confirmed)throw new Error("원본 대조 확인이 완료되지 않은 선택 사건이 있습니다: "+(row.receiptNo||"접수번호 미입력"));
    const receipt=String(row.receiptNo||"").trim();
    if(!validReceiptNumber(receipt))throw new Error("접수번호 형식 오류: "+(receipt||"미입력"));
    const title=cleanImportText(row.title,120);
    if(!title)throw new Error(receipt+"의 사건명을 입력하세요. 피의자 성명으로 사건명을 임의 생성하지 않습니다.");
    const suspect=cleanImportText(row.suspectName,120);
    const referenceNote=cleanImportText(row.referenceNote,800);
    if(taken.has(receipt))throw new Error("이미 등록된 접수번호 또는 선택한 목록 내 중복: "+receipt);
    taken.add(receipt);
    prepared.push({receipt,title,suspectName:suspect,referenceNote});
  }
  return prepared;
}
function performKicsBulkAdd(draft,journal,approvedRows){
  // This check is deliberately REPEATED inside the readwrite revision-checked IDB tx.
  const ready=prepareKicsRowsForBulk(approvedRows,draft.cases);
  const now=new Date().toISOString(),items=[];
  for(const item of ready){
    const caseId="CASE-"+crypto.randomUUID();
    const record={id:0,caseId,receiptNo:item.receipt,demo:false,title:item.title,alias:"",sheetLabel:item.title,
      suspectName:item.suspectName,referenceNote:item.referenceNote,intake:"KICS OCR TXT 사진대조 등록",
      offense:"미수집",status:"active",statusLabel:"진행",phase:"",core:"",latest:"",next:"",waiting:"",
      lastAction:"UNKNOWN",milestones:[],completed:[],documents:[],notDone:[],timeline:[],
      materials:[],externalRequests:[],waitingItems:[],confirmedNext:[],aiProposals:[],unresolved:[],
      doNotCountAsProgress:[],conflict:[],todoArchive:[],todos:[]};
    draft.cases.push(record);
    items.push({caseId,afterCase:structuredClone(record)});
  }
  // Reuses the existing photoBulk case-undo contract and backup serialization.
  journal.caseSet({kind:"photoBulk",sourceKind:"KICS_OCR_TXT",caseId:"BULK",created:true,
    beforeCase:null,items,createdAt:now});
  return items.length;
}

// ===== REDESIGN 6/8: SAME-CONVERSATION READ-ONLY CONFIRMED APPLY ACK =====
// No AI API, cloud upload, automatic clipboard or state mutation. ACK requires the
// SAME committed local revision AND every saved target still matching the journal.
// It cannot be issued for old journals lacking a revision after the commit.
function checkedCaseManagerAckSource(bundle,selectedWorkspace){
  const current=assertDemoState(bundle?.state);
  const last=validateCaseUndo(bundle?.caseApplyUndo);
  if(!last||(last.kind!=="v2BatchPatch"&&last.kind!=="batchPatch"))
    throw new Error("확인할 직전 AI 다중사건 저장기록이 없습니다. 최신 사건관리 AI 인계문을 사용하세요.");
  if(last.workspace!==selectedWorkspace||!Number.isSafeInteger(last.baseRevision)||
     !Number.isSafeInteger(last.resultRevision)||last.resultRevision!==last.baseRevision+1)
    throw new Error("저장공간 또는 저장 직후 revision을 입증할 수 없습니다. 전체 최신 인계문을 사용하세요.");
  if(current.revision!==last.resultRevision)
    throw new Error("저장 후 추가 변경이나 취소가 발생했습니다. 오래된 확인문을 재발행하지 않고 최신 전체 인계문을 사용하세요.");
  const seen=new Set(),cases=[];
  for(const item of last.items){
    if(seen.has(item.caseId))throw new Error("저장확인 대상 사건 ID가 중복됩니다.");
    seen.add(item.caseId);
    const now=current.cases.find(c=>c.caseId===item.caseId);
    if(!now||JSON.stringify(now)!==JSON.stringify(item.afterCase))
      throw new Error("저장 이후 대상 사건이 변경되었습니다. 최신 전체 인계문을 사용하세요.");
    cases.push({action:item.beforeCase===null?"created":"updated",caseId:item.caseId,
      afterCase:compactSpecialistCase(now)});
  }
  if(!cases.length)throw new Error("저장확인 대상 사건이 없습니다.");
  return {format:"CASEBOARD_AI_APPLY_ACK_V1",workspace:selectedWorkspace,
    beforeRevision:last.baseRevision,afterRevision:current.revision,
    localUpdatedAt:current.updatedAt,committedAt:last.createdAt,
    operation:last.kind,changedCases:cases.length,totalCases:current.cases.length,cases};
}
async function buildCaseManagerApplyAck(bundle){
  const workspace=TEST_MODE?"TRIAL":"LIVE";
  const source=checkedCaseManagerAckSource(bundle,workspace);
  // Exact committed AFTER state for changed cases, compacted with the SAME fields as FIRST PROMPT. No duplicate full BEFORE blobs.
  // Escapes are standard JSON; NEVER interpolate untrusted case contents as instructions.
  const json=JSON.stringify(source);
  const digest=await sha256Hex(json);
  return `CASEBOARD — 저장 결과 확인문 / 같은 ChatGPT 대화 계속하기
FORMAT: CASEBOARD_AI_APPLY_ACK_V1
APP_BUILD: ${APP_BUILD_ID}
WORKSPACE: ${workspace}
BASE_REVISION: ${source.beforeRevision}
NEW_REVISION: ${source.afterRevision}
CHANGED_CASE_COUNT: ${source.changedCases}
SNAPSHOT_SHA256: ${digest}

이 내용은 앱에 실제로 저장된 직후 상태에서 생성한 **읽기 전용 확인문**이다.
아래 JSON은 변경된 사건만 포함한다. 기존 대화의 동일 workspace·revision ${source.beforeRevision} 스냅샷을 기반으로 대상 사건들은 afterCase(사건관리 스냅샷과 동일한 필드 투영)로 교체하고, 신규 사건은 추가하여 revision ${source.afterRevision}을 현재 기준으로 삼아라. 그 외 사건은 이번 일괄 저장에서 바뀌지 않았다.

function aiV3Commit(draft,journal,pkg,selections,previewBefore){
  const result=aiV3Plan(draft,pkg,selections,{now:new Date().toISOString(),previewBefore,skipIssueItems:true});
  if(!result.items.length)throw new Error("새롭게 저장할 항목이 없습니다. 이미 적용됐거나 사건 선택·충돌 확인이 필요합니다.");
  for(const item of result.items){
    const index=draft.cases.findIndex(c=>c.caseId===item.caseId);
    if(index>=0)draft.cases[index]=structuredClone(item.afterCase);
    else draft.cases.push(structuredClone(item.afterCase));
  }
  journal.caseSet(validateCaseUndo({kind:"v2BatchPatch",caseId:"BULK",created:false,items:result.items,
    createdAt:new Date().toISOString(),workspace:TEST_MODE?"TRIAL":"LIVE",baseRevision:draft.revision,resultRevision:draft.revision+1}));
  return result;
}
async function showAiV3Editor(){
  // A single visible operation: paste -> apply. No multi-card preview, file picker,
  // candidate dropdown or second confirmation. Ambiguous/problematic items are NOT written.
  const modal=dialogCard("packageDialog",`<div class="aiV3QuickHead"><h3 class="modalHeading">대시보드에 반영하기</h3><button type="button" id="aiV3Close" aria-label="닫기" title="닫기">×</button></div>
    <textarea id="packageText" class="memoArea" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="ChatGPT에서 복사한 V3 결과물을 여기에 붙여넣으세요." aria-label="ChatGPT V3 갱신 내용 붙여넣기"></textarea>
    <div id="aiV3Status" class="aiV3QuickStatus" role="status" aria-live="polite">붙여넣고 아래 버튼을 한 번 누르면 됩니다.</div>
    <div class="aiV3QuickFoot"><button type="button" class="actionBtn" id="aiV3Apply">대시보드에 반영</button></div>`);
  modal.classList.add("aiV3QuickDialog");
  const area=modal.querySelector("#packageText"),status=modal.querySelector("#aiV3Status"),apply=modal.querySelector("#aiV3Apply");
  let busy=false;
  modal.querySelector("#aiV3Close").onclick=()=>{if(!busy)modal.remove();};
  area.addEventListener("input",()=>{if(!busy)status.textContent="붙여넣고 아래 버튼을 한 번 누르면 됩니다.";});
  function summaryNotes(pkg,selection,plan){
    const pending=[];
    for(let i=0;i<pkg.changes.length;i++){
      const invalid=pkg.invalidChanges?.find(x=>x.index===i);
      const noted=plan.issues.find(x=>x.index===i);
      const skipped=plan.skipped.find(x=>x.index===i);
      if(invalid||noted||selection[i]==="__ASK__"||skipped&&skipped.why!=="동일한 변경 이미 반영됨")
        pending.push(`${i+1}번: ${invalid?.why||noted?.why||skipped?.why||"사건 구분 필요"}`);
    }
    return pending;
  }
  apply.onclick=async()=>{
    if(busy)return;
    if(!area.value.trim()){status.textContent="갱신 내용을 먼저 붙여넣으세요.";area.focus();return;}
    busy=true;apply.disabled=true;apply.textContent="반영 중…";
    try{
      const pkg=aiV3Package(area.value);
      if(pkg.workspace&&pkg.workspace!==(TEST_MODE?"TRIAL":"LIVE"))throw new Error("작업공간이 다릅니다. 현재 "+(TEST_MODE?"TRIAL":"LIVE")+" 공간입니다.");
      // Always re-identify against the latest local state. The earlier ChatGPT
      // baseRevision is informational, not a reason to reject a safe V3 package.
      for(let attempt=0;attempt<2;attempt++){
        await writeQueue;
        const current=await readLocalState();
        const selections=pkg.changes.map((ch,i)=>pkg.invalidChanges?.some(e=>e.index===i)?"__SKIP__":aiV3Default(current,ch).target);
        const before=Object.fromEntries(selections.map((id,i)=>[i,current.cases.find(c=>c.caseId===id)?structuredClone(current.cases.find(c=>c.caseId===id)):null]));
        const planned=aiV3Plan(current,pkg,selections,{previewBefore:before,skipIssueItems:true});
        const initialPending=summaryNotes(pkg,selections,planned);
        if(!planned.items.length){
          status.textContent=initialPending.length?`자동 반영 가능한 항목 없음 · 보류 ${initialPending.length}건. ${initialPending.slice(0,3).join(" / ")}`:"이미 반영된 내용이거나 변경사항이 없습니다.";
          break;
        }
        let receipt=null;
        try{
          const committed=await commitDemoMutation(current.revision,(draft,journal)=>{
            receipt=aiV3Commit(draft,journal,pkg,selections,before);
          });
          const verified=await readLocalState();
          if(!verified||verified.revision!==committed.state.revision||!receipt||receipt.items.some(item=>
            JSON.stringify(verified.cases.find(c=>c.caseId===item.caseId))!==JSON.stringify(item.afterCase)))
            throw new Error("저장 후 재읽기 검증 실패. 백업 및 사건 현황을 확인하세요.");
          afterPersist(verified);renderList();
          const pending=summaryNotes(pkg,selections,receipt);
          const message=`반영 완료 · ${receipt.items.length}개 사건 · 회차 ${verified.revision}${pending.length?` · 보류 ${pending.length}건`:""}`;
          showStorageStatus("IndexedDB "+message+". 기기간 동기화 없음.");
          if(!pending.length){modal.remove();toast(message);}
          else {status.textContent=message+"\n"+pending.slice(0,4).join(" / ")+". 보류 항목은 수정한 V3 결과물로 다시 반영하세요.";toast(`저장 ${receipt.items.length}건 · 보류 ${pending.length}건`);}
          break;
        }catch(e){if(e instanceof RevisionConflictError&&attempt===0)continue;throw e;}
      }
    }catch(e){status.textContent="반영 실패: "+String(e.message||e);}
    finally{busy=false;apply.disabled=false;apply.textContent="대시보드에 반영";}
  };
}

async function doReset(){
  const n=CASES.reduce((a,c)=>a+(v2LifeState(c)==="archived"?0:c.todos.filter(t=>t.done).length),0);
  if(!n){toast("체크된 TODO가 없습니다.");return;}
  if(!confirm(`완료 체크 ${n}건을 작업판에서 정리하시겠습니까?\n직전 완료정리는 완료정리복원으로 복구할 수 있습니다.`))return;
  const ok=await queuePersistentMutation("완료TODO정리",(d,j)=>performReset(d,j));
  if(ok){editMode=false;renderList();}
}

}

async function sha256BufferHex(bytes){
  const h=await crypto.subtle.digest("SHA-256",bytes);

async function sha256Base64Text(text){

async function getSourceResponse(filename){
  const u=new URL(filename==="index.html"?"./":"./"+filename,location.href);
  // A same-origin GET of the *public application code*, never user data.
  // Online source takes priority over possibly stale offline cache.
  if(navigator.onLine){

      if(response.ok)return {response,origin:"same-origin public deployment"};
    }catch(_){/* Use the offline shell if it exists. */}

  if(!globalThis.caches)throw new Error(filename+": 로컬 캐시 없음 또는 인터넷 연결 필요");
  const names=(await caches.keys()).filter(x=>x.startsWith("caseboard-shell-")).reverse();
  for(const name of names){
    const cache=await caches.open(name);
    const keys=filename==="index.html"?[new URL("./",location.href).href,new URL("./index.html",location.href).href]:[new URL("./"+filename,location.href).href];
    for(const key of keys){const hit=await cache.match(key);if(hit?.ok)return {response:hit,origin:"offline shell cache: "+name};}

async function collectPublicSourceBundle(){

      if(name==="index.html"){

        if(!m||!st)throw new Error("원문 script/style 없음");
        if(!runtimeBuild||runtimeBuild!==APP_BUILD_ID||!text.includes('name="caseboard-build" content="'+APP_BUILD_ID+'"'))throw new Error("실행 버전과 원문 버전 불일치");

    }catch(err){parts[name]={name,verified:false,error:String(err.message||err)};problems.push(name+": "+String(err.message||err));}
  }

function caseForUnifiedAi(c,detail=false){
  const fields=["caseId","receiptNo","title","alias","suspectName","offense","status",
    "statusLabel","phase","latest","next","waiting","lastAction"];
  if(detail)fields.push("intake","core","referenceNote");
  const result={};
  for(const k of fields)if(c[k]!==undefined&&c[k]!==null&&c[k]!=="")result[k]=c[k];
  result.todos=(c.todos||[]).map(t=>({todoId:t.todoId,text:t.text,section:t.section,
    done:!!t.done,checkedAt:t.checkedAt||null,dueDate:t.dueDate||null}));
  if(detail){
    result.todoArchive=(c.todoArchive||[]).map(t=>({todoId:t.todoId,text:t.text,
      section:t.section,done:!!t.done,checkedAt:t.checkedAt||null,dueDate:t.dueDate||null}));
    for(const k of ["milestones","completed","documents","notDone","timeline",
      "materials","externalRequests","waitingItems","confirmedNext","unresolved",
      "conflict","currentCorrectionHistory","lifecycleHistory"])
      if(Array.isArray(c[k])&&c[k].length)result[k]=structuredClone(c[k]);
    if(c.caseLifecycle!==undefined)result.caseLifecycle=structuredClone(c.caseLifecycle);
  }else{
    const recent=(c.completed||[]).slice(-2);
    if(recent.length)result.recentCompleted=recent;
    if(Array.isArray(c.todoArchive)&&c.todoArchive.length)
      result.recentArchivedTodos=c.todoArchive.slice(-3).map(t=>({todoId:t.todoId,text:t.text}));
  }
  return result;
}

  if(selectedCaseId&&!selected)throw new Error("선택한 사건을 현재 저장소에서 찾지 못했습니다.");
  const scope=selected?"SELECTED_CASE":"DAILY_INDEX";
  const cases=selected?[caseForUnifiedAi(selected,true)]:full.cases.map(c=>caseForUnifiedAi(c,false));
  const data={format:"CASEBOARD_UNIFIED_AI_CONTEXT_V1",scope,appBuild:APP_BUILD_ID,
    workspace,revision:full.revision,updatedAt:full.updatedAt,
    exportedAt:new Date().toISOString(),caseCount:full.cases.length,cases};
  const payload=JSON.stringify(data);
  const digest=await sha256Hex(payload);
  return `CASEBOARD — 통합 ChatGPT 작업 컨텍스트
MODE: ${scope}
WORKSPACE: ${workspace}
EXPORTED_AT: ${data.exportedAt}
SOURCE_REVISION: ${full.revision}
APP_BUILD: ${APP_BUILD_ID}
SNAPSHOT_SHA256: ${digest}

[통합 운영 원칙]
- 이 ChatGPT는 별도 사건관리/설계/개발 전담 역할로 분리되지 않는다. 사용자의 요청에 따라 사건 갱신, 조사·업무 정리, UI/UX 수정 및 인수인계를 모두 지원한다.
- 사용자의 자유 메모·STT/OCR 오타에서 사건번호, 이름, 사건유형, 실제 업무 문맥을 활용해 **필요한 후보만** 비교한다. 이름만 같다는 이유로 별개 사건을 자동 병합하지 않는다.
- 조사/영장 결재/신청/발부/집행/회신은 서로 다른 진행 단계다. 완료 언급이 없는 업무를 완료로 꾸미지 않는다. 기존 완료·보관 TODO를 새 업무로 반복 추가하지 않는다.
- 실제 사건 갱신 요청에는 설명만 주지 말고 앱에 적용 가능한 단일 결과물을 우선 발행한다. 사실관계나 귀속이 실질적으로 다를 때만 해당 항목을 확인한다.
- 각 기기 로컬 저장소는 ChatGPT에 자동 연결되지 않는다. 이 자료는 ${data.exportedAt} 시점의 읽기 전용 스냅샷이며, 웹앱의 사건정보를 바꾸지 않았다.
- 이 앱의 기본 갱신 형식은 CASEBOARD_AI_UPDATE_V3이다. JSON 전체를 [CASEBOARD_AI_UPDATE_V3] 및 [END_CASEBOARD_AI_UPDATE_V3]으로 감싸거나 단독 JSON으로 제공한다.
- JSON 예시: {"type":"CASEBOARD_AI_UPDATE_V3","schemaVersion":3,"workspace":"${workspace}","changes":[{"action":"patch","match":{"title":"기존 사건명 또는 접수번호"},"set":{"latest":"확인된 최신 경과"},"addTodos":[{"text":"필요한 후속 조치","section":"normal"}],"completeTodos":[{"text":"실제로 끝낸 기존 TODO"}],"append":{"timeline":[{"date":"2026-10-15","text":"확인된 작업"}]}}]}. 신설 시 action:create,create:{title,receiptNo:"UNKNOWN",offense,...} 사용.
- AI는 음성·OCR 오류와 자연어를 추론해 정확한 증거 구분과 실제 완료 여부를 반영하고 단일 V3 결과물을 발행한다. 웹앱은 현재 사건 후보 식별·중복 방지·일부 오류 분리·저장을 수행한다. baseRevision은 참고값이며 동일하지 않아도 갱신 가능하다. 이름·문맥이 여러 사건에 걸치면 해당 항목만 사용자 선택으로 정리한다. 백업/로컬 기록·민감 정보를 공개 코드에 넣지 않는다.
- AIUNIFY3에서는 V3 addTodos[].dueDate 와 scheduleTodos:[{text,todoId(선택),dueDate:"YYYY-MM-DD" 또는 빈 문자열로 해제}]를 지원한다. 기한이 지난 미완료·오늘 예정·오늘 체크 완료 TODO로 당일 진척률을 계산한다. 오래된 미완료 TODO를 임의로 오늘로 배정하지 않으며 이월 날짜는 원본을 유지한다. 사건 상세의 완료된 진행에는 체크된 TODO가 실시간 표시된다.
- TODO 이동/문구수정, 현재 상태 배열 정정, 사건 병합·아카이브는 V3 신규 명령에 아직 포함되지 않는다. 실제 반영 성공은 웹앱이 저장 후 재읽기로 판단한다.
- 사적 수사기록은 기관의 보안 지침을 준수하고, 공개 GitHub HTML·SW·이슈에 넣지 않는다.

[선택된 로컬 현황 데이터 시작 sha256=${digest}]
${payload}
[선택된 로컬 현황 데이터 끝]
`;
}
function downloadManagementTxt(content,kind="full"){

  const blob=new Blob([content],{type:"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  toast("인계문 TXT 저장을 요청했습니다. 파일 앱에서 저장 여부를 확인하세요.");
}

      if(!modal.isConnected||token!==generationToken)return;

async function sha256Hex(data){
  if(!crypto.subtle)throw new Error("보안 연결(HTTPS)에서만 백업 검증을 사용할 수 있습니다.");
  const bytes=new TextEncoder().encode(data),h=await crypto.subtle.digest("SHA-256",bytes);
  return Array.from(new Uint8Array(h),x=>x.toString(16).padStart(2,"0")).join("");
}
async function createBackupFile(){

  const digest=await sha256Hex(JSON.stringify(payload));
  const backupDoc={...payload,sha256:digest};
  const data=JSON.stringify(backupDoc,null,2);

async function parseBackupFile(file){
  if(!file||file.size>MAX_BACKUP_BYTES)throw new Error("5MB 이하 JSON 백업파일만 허용합니다.");
  const doc=JSON.parse(await file.text());
  const {sha256,...payload}=doc;
  if(typeof sha256!=="string"||sha256!==await sha256Hex(JSON.stringify(payload)))throw new Error("백업 무결성 검증에 실패했습니다.");
  // REDESIGN8: bundled synthetic acceptance fixture is explicitly TRIAL-only.
  // Ordinary backups and their existing version/format stay fully compatible.
  if(payload.fixtureScope==="TRIAL_ONLY"&&!TEST_MODE)
    throw new Error("가상 사건 시험자료는 TRIAL에서만 복원할 수 있습니다. LIVE 데이터는 변경하지 않았습니다.");
  return validateBackupObject(payload);
}
async function restoreSelectedFile(file,firstRun=false){
  try{

    if(!confirm(`사건 ${loaded.state.cases.length}건 / TODO ${todoCount}건을 ${TEST_MODE?'시험 공간':'실제 현황판'}에 복원하시겠습니까?\n현재 선택한 공간의 데이터만 교체되며, 반대편 저장공간은 유지됩니다. 복원 전에 백업을 권장합니다.`))return false;
    if(!firstRun)await writeQueue;
    const newState=await restoreLocalBundle(loaded,firstRun?null:state.revision);

    toast("백업을 복원했습니다.");return true;
  }catch(e){toast("복원 실패: "+e.message);return false;}
}

// WEB V1 7/8 — a cached response is usable offline only if it is HTML,
// successful, and lacks redirect history (iOS WebKit navigation restriction).
// Returns metadata only, never the cached HTML body.
async function inspectOfflineShellCache(){
  const output={found:false,usable:false,cacheName:null,redirectFree:false,htmlContentType:false};
  if(!globalThis.caches)return output;
  const home=new URL("./",location.href).href;
  const index=new URL("./index.html",location.href).href;
  const keys=(await caches.keys()).filter(k=>k.startsWith("caseboard-shell-")).reverse();
  for(const name of keys){
    const cache=await caches.open(name);
    let candidate=(await cache.match(home))||(await cache.match(index));
    if(!candidate)continue;
    output.found=true;
    if(output.cacheName===null)output.cacheName=name;
    const isHtml=String(candidate.headers?.get("content-type")||"").toLowerCase().includes("text/html");
    const isClean=candidate.redirected!==true&&candidate.type!=="opaqueredirect";
    if(isHtml&&isClean&&candidate.ok){
      // Read cloned body only. No mutation, no endpoint fetch, no personal data.
      const sample=(await candidate.clone().text()).slice(0,2048).toLowerCase();
      if(sample.includes("<html")||sample.includes("<!doctype html")){
        return {found:true,usable:true,cacheName:name,redirectFree:true,htmlContentType:true};
      }
    }
    // Continue searching another shell version, if present.
    output.redirectFree=output.redirectFree||isClean;
    output.htmlContentType=output.htmlContentType||isHtml;
  }
  return output;
}

// In-memory export -> JSON parse -> SHA-256 -> schema validation.
// This DOES NOT download a file, touch IndexedDB, or change any TODO/memo.
async function runReadOnlyBackupSelfCheck(){
  const b=await readLocalBundle();
  const payload={format:BACKUP_FORMAT,backupVersion:BACKUP_VERSION,
    exportedAt:new Date().toISOString(),state:b.state,
    todoResetUndo:b.todoResetUndo,caseApplyUndo:b.caseApplyUndo};
  const digest=await sha256Hex(JSON.stringify(payload));
  const roundtrip=JSON.parse(JSON.stringify({...payload,sha256:digest}));
  const {sha256:receivedDigest,...clean}=roundtrip;
  if(receivedDigest!==await sha256Hex(JSON.stringify(clean)))throw new Error("Backup checksum mismatch");
  const parsed=validateBackupObject(clean);
  if(JSON.stringify(parsed.state)!==JSON.stringify(b.state))throw new Error("Backup state round-trip mismatch");
  if(JSON.stringify(parsed.todoResetUndo)!==JSON.stringify(b.todoResetUndo))throw new Error("R undo round-trip mismatch");
  if(JSON.stringify(parsed.caseApplyUndo)!==JSON.stringify(b.caseApplyUndo))throw new Error("Case undo round-trip mismatch");
  return {ok:true,algorithm:"SHA-256",scope:"in-memory only",revision:b.state.revision};
}

// WEB V1 6/8 — privacy-minimal local device diagnostics.
// No receiptNo, caseId, case title, TODO text, or memo body is collected or transmitted.
// The diagnostic is read-only; it neither resets state nor requests storage permission.
async function collectDeviceDiagnostics(){
  await writeQueue;
  const report={
    version:APP_BUILD_ID,
    inspectedAt:new Date().toISOString(),
    origin:location.origin,
    workspace:TEST_MODE?"trial-isolated":"live-production",
    databaseName:DB_NAME,
    secureContext:Boolean(globalThis.isSecureContext),
    displayMode:standaloneMode()?"standalone":"browser",
    networkHint:navigator.onLine?"online (hint only)":"offline (hint only)",
    storage:{kind:"IndexedDB (device-local)",available:Boolean(globalThis.indexedDB),ok:false},
    serviceWorker:{supported:"serviceWorker" in navigator,registered:false,controlled:Boolean(navigator.serviceWorker?.controller),activeState:"none"},
    shellCache:{found:false,cacheName:null},
    persistence:{persisted:"unknown",usageBytes:null,quotaBytes:null}
  };
  try{
    const bundle=await readLocalBundle();
    const st=bundle.state;
    report.storage={
      kind:"IndexedDB (device-local)",available:true,ok:true,
      revision:st.revision,caseCount:st.cases.length,
      activeTodoCount:st.cases.reduce((n,c)=>n+c.todos.length,0),
      checkedTodoCount:st.cases.reduce((n,c)=>n+c.todos.filter(t=>t.done).length,0),
      archivedTodoCount:st.cases.reduce((n,c)=>n+c.todoArchive.length,0),
      memoCharacterCount:String(st.board.memo||"").length,
      lastModifiedAt:st.updatedAt,
      resetUndoAvailable:Boolean(bundle.todoResetUndo),
      caseApplyUndoAvailable:Boolean(bundle.caseApplyUndo)
    };
  }catch(e){report.storage.error=String(e.message||e).slice(0,180);}
  if(report.serviceWorker.supported){
    try{
      const reg=await navigator.serviceWorker.getRegistration("./");
      report.serviceWorker.registered=Boolean(reg);
      report.serviceWorker.activeState=reg?.active?.state||"none";
    }catch(e){report.serviceWorker.error=String(e.message||e).slice(0,160);}
  }
  if(globalThis.caches){
    try{report.shellCache=await inspectOfflineShellCache();}
    catch(e){report.shellCache.error=String(e.message||e).slice(0,160);}
  }
  try{report.backupSelfCheck=await runReadOnlyBackupSelfCheck();}
  catch(e){report.backupSelfCheck={ok:false,error:String(e.message||e).slice(0,160)};}
  if(navigator.storage){
    try{
      if(navigator.storage.persisted)report.persistence.persisted=Boolean(await navigator.storage.persisted());
      if(navigator.storage.estimate){
        const est=await navigator.storage.estimate();
        report.persistence.usageBytes=Number.isFinite(est.usage)?Math.round(est.usage):null;
        report.persistence.quotaBytes=Number.isFinite(est.quota)?Math.round(est.quota):null;
      }
    }catch(e){report.persistence.error=String(e.message||e).slice(0,160);}
  }
  return report;
}

    } catch(readError) { console.error("Cannot reload IndexedDB",readError); }

    if(ok){focusMovedRow(caseId,todoId,kind);toast(desc.toast);}
    else toast("이동 저장에 실패했습니다.");
  }finally{orderingBusy=false;}
}
async function moveTodoToSection(caseId,todoId,targetSection){
  if(orderingBusy||!editMode)return;
  const target=getTodo(caseId,todoId);if(!target)return;
  if(target.section===targetSection)return; // No write, no revision increase.
  const destination=TODO_SECTIONS.find(x=>x.id===targetSection);
  if(!destination){toast("잘못된 구역입니다.");return;}
  orderingBusy=true;
  try{
    const position=sectionRows(targetSection).length;
    const ok=await queuePersistentMutation("TODO 구역 이동",draft=>moveTodo(draft,caseId,todoId,targetSection,position));
    if(ok){focusMovedRow(caseId,todoId,"section");toast(destination.label+"로 이동했습니다.");}
    else toast("이동 저장에 실패했습니다.");
  }finally{orderingBusy=false;}
}

function openReceiptEditor(caseId){

  const old=document.getElementById("receiptOverlay");if(old)old.remove();
  const overlay=document.createElement("div");
  overlay.id="receiptOverlay";overlay.className="overlay";
  const initial=(!c.receiptNo||c.receiptNo==="UNKNOWN")?"2026-":c.receiptNo;
  overlay.innerHTML=`<div class="editorCard">
    <div class="editorTitle">접수번호 수정</div>

    <div class="editorActions"><button class="actionBtn" id="receiptCancel">취소</button><button class="actionBtn" id="receiptSave">저장</button></div>
  </div>`;
  document.body.appendChild(overlay);
  const input=document.getElementById("receiptInput");
  input.focus();setTimeout(()=>input.setSelectionRange(input.value.length,input.value.length),30);
  document.getElementById("receiptCancel").onclick=()=>overlay.remove();
  document.getElementById("receiptSave").onclick=()=>{
    let v=input.value.trim();if(!v)v="UNKNOWN";
    if(v!=="UNKNOWN"&&CASES.some(x=>x.caseId!==caseId&&x.receiptNo===v)){toast("같은 접수번호가 이미 있습니다.");return;}
    document.getElementById("receiptSave").disabled=true;
    queuePersistentMutation("접수번호 수정",draft=>changeReceipt(draft,caseId,v)).then(ok=>{
      const existing=document.getElementById("receiptOverlay");

// WEB V1 5/8: app-shell cache. Records stay exclusively in IndexedDB.
let pwaReady=false,pwaError="";
const swUrl="./sw.js";
async function verifyPwaShell(){

    pwaReady=Boolean(status.usable);
  }catch(_){pwaReady=false;}
  refreshPwaStatus();
}
function standaloneMode(){try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;}catch(_){return navigator.standalone===true;}}
function refreshPwaStatus(){
  const el=document.getElementById("pwaStatus");if(!el)return;
  el.className="pwaStatus";
  if(!navigator.onLine){el.textContent=pwaReady?"오프라인 · 기기 내부 데이터 사용 중":"오프라인 · 캐시 확인 필요";el.classList.add("offline");return;}

  if(pwaReady){el.textContent=standaloneMode()?"홈 화면 앱 · 오프라인 준비됨":"온라인 · 오프라인 준비됨";el.classList.add("ready");return;}

async function setupPwa(){
  if(!("serviceWorker" in navigator)||!isSecureContext){pwaError="브라우저 미지원";refreshPwaStatus();return;}
  try{
    const reg=await navigator.serviceWorker.register(swUrl,{scope:"./",updateViaCache:"none"});
    refreshPwaStatus();
    navigator.serviceWorker.ready.then(async r=>{pwaError="";await verifyPwaShell();}).catch(e=>{pwaError=e.message;refreshPwaStatus();});
    reg.addEventListener("updatefound",()=>{
      const w=reg.installing;if(!w)return;
      w.addEventListener("statechange",()=>{if(w.state==="activated"){pwaError="";verifyPwaShell();}});
    });
  }catch(e){pwaError=String(e.message||e);console.warn("PWA registration",e);refreshPwaStatus();}
}
async function doPwaUpdate(){
  if(!navigator.onLine){toast("인터넷 연결 후 업데이트하세요.");return;}
  if(savingCount){toast("로컬 저장이 완료된 뒤 다시 시도하세요.");return;}
  if(document.getElementById("kicsOriginalViewerDialog")||document.getElementById("memoDialog")||document.getElementById("receiptOverlay")||document.getElementById("packageDialog")||document.getElementById("dataDialog")||document.getElementById("deviceDiagnosisDialog")){toast("열려 있는 창을 먼저 닫고 업데이트하세요.");return;}
  if(!confirm("최신 웹앱 화면으로 다시 불러올까요?\n기기 내부의 체크·메모는 유지됩니다."))return;
  try{
    await writeQueue;
    if("serviceWorker" in navigator){const r=await navigator.serviceWorker.getRegistration("./");if(r)await r.update();}
    location.reload();
  }catch(e){toast("업데이트 실패: "+String(e.message||e));}
}
window.addEventListener("online",refreshPwaStatus);
window.addEventListener("offline",refreshPwaStatus);
if("serviceWorker" in navigator)navigator.serviceWorker.addEventListener("controllerchange",()=>{verifyPwaShell();});

renderList();
setupPwa();
</script>
